<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PATROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #171224;
    color: #fff7d6;
    font-family: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    touch-action: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #171224;
    cursor: crosshair;
  }

  #glCanvas, #hudCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hudCanvas { pointer-events: none; }

  /* Loading Screen */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #171224;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.32s ease, visibility 0.32s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .load-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(28px, 6vw, 54px);
    letter-spacing: 0.18em;
    color: #ffe5a3;
    text-shadow: 0 4px 0 #4b3357, 4px 4px 0 #171224;
    padding-left: 0.18em;
  }
  .load-sub {
    font-size: 13px;
    letter-spacing: 0.24em;
    color: #cf8d92;
    text-transform: uppercase;
  }
  .progress-frame {
    width: min(360px, 78vw);
    height: 16px;
    border: 2px solid #7c6391;
    background: #231836;
    padding: 2px;
    box-shadow: 0 3px 0 #0e0a17;
  }
  #progressFill {
    width: 0%;
    height: 100%;
    background: repeating-linear-gradient(
      90deg,
      #f7bd7c 0px,
      #f7bd7c 8px,
      #eb9d7e 8px,
      #eb9d7e 10px
    );
    transition: width 0.08s linear;
  }
  #loadStatus {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #a682a3;
    min-height: 16px;
  }

  /* Title Card (fades smoothly after first player input) */
  #titleCard {
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    pointer-events: none;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  #titleCard.dismissed {
    opacity: 0;
    transform: translateX(-50%) translateY(-14px);
  }
  #titleCard h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(26px, 5vw, 48px);
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    color: #fff7d6;
    text-shadow:
      0 3px 0 #cf6d2b,
      0 6px 0 #231836,
      3px 3px 0 #171224;
    margin-bottom: 10px;
  }
  #titleCard .tagline {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: #ffe5a3;
    background: rgba(23, 18, 36, 0.72);
    border: 1px solid rgba(247, 189, 124, 0.45);
    padding: 5px 12px;
    text-transform: uppercase;
  }
  #titleCard .prompt {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: #e6e2d3;
    text-shadow: 0 1px 0 #171224, 1px 1px 0 #171224;
    opacity: 0.9;
  }

  /* Quiet Bottom Control Hint Bar */
  #hintBar {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 10px;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #e6e2d3;
  }
  .bar-group {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(23, 18, 36, 0.74);
    border: 1px solid rgba(166, 130, 163, 0.4);
    padding: 5px 10px;
    pointer-events: auto;
    backdrop-filter: none;
  }
  .hint-keys {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .hint-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #cfc4d8;
    white-space: nowrap;
  }
  .keycap {
    color: #ffe5a3;
    border: 1px solid rgba(247, 189, 124, 0.48);
    background: rgba(75, 51, 87, 0.55);
    padding: 1px 5px;
    font-size: 10px;
  }
  .view-badge {
    color: #f7bd7c;
    min-width: 70px;
    text-align: center;
    cursor: pointer;
    border: 1px solid rgba(247, 189, 124, 0.45);
    background: rgba(56, 38, 69, 0.65);
    padding: 2px 7px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .view-badge:hover { background: rgba(90, 69, 117, 0.85); color: #fff7d6; }

  /* Missile Rack Counter */
  .msl-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #ffe5a3;
  }
  .msl-slots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .msl-pip {
    width: 8px;
    height: 13px;
    border: 1px solid #7c6391;
    background: #231836;
    position: relative;
    overflow: hidden;
  }
  .msl-pip.ready {
    border-color: #f7bd7c;
    background: #ffe5a3;
    box-shadow: inset 0 3px 0 #d93843;
  }
  .msl-pip .reload-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: #eb9d7e;
  }

  #soundBtn {
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #a682a3;
    background: rgba(35, 24, 54, 0.85);
    border: 1px solid rgba(166, 130, 163, 0.5);
    padding: 2px 8px;
    min-width: 74px;
    text-align: center;
  }
  #soundBtn.on {
    color: #ffe5a3;
    border-color: #f7bd7c;
    background: rgba(90, 69, 117, 0.8);
  }
  #soundBtn:hover { color: #fff7d6; }

  /* Touch Controls */
  #touchControls {
    position: fixed;
    inset: 0;
    z-index: 22;
    pointer-events: none;
    display: none;
  }
  #touchControls.active { display: block; }

  #touchStick {
    position: absolute;
    left: 18px;
    bottom: 58px;
    width: 118px;
    height: 118px;
    border: 2px solid rgba(255, 229, 163, 0.45);
    background: rgba(23, 18, 36, 0.42);
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
  }
  #touchKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border: 2px solid #ffe5a3;
    background: rgba(247, 189, 124, 0.45);
    border-radius: 50%;
    pointer-events: none;
  }
  .touch-buttons {
    position: absolute;
    right: 16px;
    bottom: 58px;
    display: grid;
    grid-template-columns: repeat(2, 66px);
    gap: 10px;
    pointer-events: auto;
  }
  .tbtn {
    height: 48px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #fff7d6;
    background: rgba(35, 24, 54, 0.78);
    border: 2px solid rgba(247, 189, 124, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .tbtn.pressed {
    background: rgba(235, 157, 126, 0.72);
    color: #171224;
    border-color: #fff7d6;
  }
  .tbtn.fire { border-color: #d93843; color: #ffe5a3; }

  @media (max-width: 780px) {
    .hint-keys { display: none; }
    #hintBar { justify-content: flex-end; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="glCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>
</div>

<div id="loader">
  <div class="load-title">PATROL</div>
  <div class="load-sub">AUTUMN LAKE DISTRICT</div>
  <div class="progress-frame"><div id="progressFill"></div></div>
  <div id="loadStatus">BOOTING TERRAIN WORKERS...</div>
</div>

<div id="titleCard">
  <h1>PATROL</h1>
  <div class="tagline">AUTUMN LAKE DISTRICT · DUSK SORTIE</div>
  <div class="prompt">MOVE MOUSE TO TAKE CONTROL · SPACE TO SWITCH VIEW</div>
</div>

<div id="touchControls">
  <div id="touchStick"><div id="touchKnob"></div></div>
  <div class="touch-buttons">
    <button class="tbtn" id="btnView" type="button">VIEW</button>
    <button class="tbtn" id="btnRoll" type="button">ROLL</button>
    <button class="tbtn" id="btnBurn" type="button">BURN</button>
    <button class="tbtn fire" id="btnFire" type="button">FIRE</button>
  </div>
</div>

<div id="hintBar">
  <div class="bar-group hint-keys">
    <span class="hint-item"><span class="keycap">SPACE</span> VIEW</span>
    <span class="hint-item"><span class="keycap">MOUSE</span> STEER</span>
    <span class="hint-item"><span class="keycap">LMB</span> ROLL / HOLD BURNER</span>
    <span class="hint-item"><span class="keycap">RMB</span>/<span class="keycap">F</span> MISSILE</span>
  </div>
  <div class="bar-group">
    <button id="viewBtn" class="view-badge" type="button" title="Cycle Camera (Space)">TOP-DOWN</button>
    <div class="msl-wrap" title="Missiles">
      <span>MSL</span>
      <div class="msl-slots" id="mslSlots">
        <div class="msl-pip ready"><div class="reload-bar"></div></div>
        <div class="msl-pip ready"><div class="reload-bar"></div></div>
        <div class="msl-pip ready"><div class="reload-bar"></div></div>
        <div class="msl-pip ready"><div class="reload-bar"></div></div>
      </div>
    </div>
    <button id="soundBtn" type="button" title="Toggle Web Audio Sound">SFX OFF</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. CURATED 48-COLOR AUTUMN SUNSET LAKE DISTRICT PALETTE
  // =========================================================================
  const PALETTE_HEX = [
    // Ink & Deep Shadows (0..3)
    '#171224', '#231836', '#13203b', '#212e2b',
    // Twilight Sky & Lilac-Golden Haze (4..14)
    '#191630', '#282247', '#3d305c', '#5a4575',
    '#7c6391', '#a682a3', '#cf8d92', '#eb9d7e',
    '#f7bd7c', '#ffe5a3', '#fff7d6',
    // Clouds & Atmospheric Shadows (15..18)
    '#4b3357', '#7d5272', '#c9787c', '#f5b895',
    // Water Depth Bands & Foam (19..24)
    '#1c3357', '#244c6e', '#2f6b80', '#48949a',
    '#73bdb3', '#e6e2d3',
    // Land: Sand, Grass, Conifers (25..28)
    '#c9a679', '#9e8d58', '#737046', '#3a4738',
    // Autumn Forest: Gold, Orange, Russet, Crimson, Umber (29..34)
    '#e89c3a', '#cf6d2b', '#9e4427', '#a82d38',
    '#6b2334', '#59352f',
    // Alpine Rock & Snow (35..39)
    '#8a7c94', '#62566e', '#40364f', '#f2d9cc', '#b8a4bf',
    // Aircraft Splinter Camo, Radome, Canopy, Tail Cap, Fire/FX (40..47)
    '#b6c0cf', '#7e899c', '#4d5669', '#2c3242',
    '#d93843', '#f25c2a', '#f5b53d', '#ffffff'
  ];

  function hexToRgb01(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
  }
  const PALETTE_RGB = new Float32Array(PALETTE_HEX.length * 3);
  for (let i = 0; i < PALETTE_HEX.length; i++) {
    const c = hexToRgb01(PALETTE_HEX[i]);
    PALETTE_RGB[i * 3 + 0] = c[0];
    PALETTE_RGB[i * 3 + 1] = c[1];
    PALETTE_RGB[i * 3 + 2] = c[2];
  }

  // =========================================================================
  // 2. WORLD CONSTANTS & SUN CONFIGURATION
  // =========================================================================
  const TERRAIN_RES = 512;       // Seamless 512x512 float16 heightfield (2400m tile = 4.68m/texel, ultra-fast worker bake + iGPU cache friendly)
  const TILE_SIZE = 2400.0;      // World tile width/length in meters
  const WATER_Y = 0.0;
  const WATER_LEVEL_NORM = 0.27; // Normalized height of lake surface
  const MAX_TERRAIN_Y = 215.0;   // Highest snow peaks
  const MIN_TERRAIN_Y = -48.0;   // Deepest lake basins
  const CLOUD_BASE_Y = 112.0;    // Cumulus deck below cruising altitude
  const CLOUD_TOP_Y = 152.0;
  const CRUISE_ALT_Y = 198.0;    // Default cruising height above clouds

  // Low sunset sun in West-Southwest (dramatic long shadows pointing East-Northeast, North is -Z)
  const SUN_AZIMUTH = -2.28;     // Radians from +X toward -Z -> low WSW sun
  const SUN_ELEV = 0.165;        // ~9.5 degrees above horizon
  const SUN_DIR = [
    Math.cos(SUN_ELEV) * Math.cos(SUN_AZIMUTH),
    Math.sin(SUN_ELEV),
    Math.cos(SUN_ELEV) * Math.sin(SUN_AZIMUTH)
  ];
  {
    const l = Math.hypot(SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]);
    SUN_DIR[0] /= l; SUN_DIR[1] /= l; SUN_DIR[2] /= l;
  }

  const MAX_IMPACTS = 16;

  // =========================================================================
  // 3. MATH HELPERS (Vec3 / Mat4)
  // =========================================================================
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(a, b, x) {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function v3Norm(v) {
    const l = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / l, v[1] / l, v[2] / l];
  }
  function v3Cross(a, b) {
    return [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
  }
  function v3Dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

  function mat4Perspective(fovY, aspect, near, far) {
    const f = 1.0 / Math.tan(fovY * 0.5);
    const nf = 1.0 / (near - far);
    const m = new Float32Array(16);
    m[0] = f / aspect;
    m[5] = f;
    m[10] = (far + near) * nf;
    m[11] = -1;
    m[14] = (2 * far * near) * nf;
    return m;
  }

  function mat4LookAt(eye, target, up) {
    const z = v3Norm([eye[0] - target[0], eye[1] - target[1], eye[2] - target[2]]);
    const x = v3Norm(v3Cross(up, z));
    const y = v3Cross(z, x);
    const m = new Float32Array(16);
    m[0] = x[0]; m[1] = y[0]; m[2] = z[0]; m[3] = 0;
    m[4] = x[1]; m[5] = y[1]; m[6] = z[1]; m[7] = 0;
    m[8] = x[2]; m[9] = y[2]; m[10] = z[2]; m[11] = 0;
    m[12] = -v3Dot(x, eye);
    m[13] = -v3Dot(y, eye);
    m[14] = -v3Dot(z, eye);
    m[15] = 1;
    return m;
  }

  function mat4Mul(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }

  function mat4FromBasisPos(right, up, back, pos, scale = 1.0) {
    const m = new Float32Array(16);
    m[0] = right[0] * scale; m[1] = right[1] * scale; m[2] = right[2] * scale; m[3] = 0;
    m[4] = up[0] * scale;    m[5] = up[1] * scale;    m[6] = up[2] * scale;    m[7] = 0;
    m[8] = back[0] * scale;  m[9] = back[1] * scale;  m[10] = back[2] * scale; m[11] = 0;
    m[12] = pos[0];          m[13] = pos[1];          m[14] = pos[2];          m[15] = 1;
    return m;
  }

  function projectPoint(vp, p, W, H) {
    const x = vp[0] * p[0] + vp[4] * p[1] + vp[8] * p[2] + vp[12];
    const y = vp[1] * p[0] + vp[5] * p[1] + vp[9] * p[2] + vp[13];
    const z = vp[2] * p[0] + vp[6] * p[1] + vp[10] * p[2] + vp[14];
    const w = vp[3] * p[0] + vp[7] * p[1] + vp[11] * p[2] + vp[15];
    if (w <= 0.001) return null;
    const ndcX = x / w;
    const ndcY = y / w;
    return {
      x: (ndcX * 0.5 + 0.5) * W,
      y: (0.5 - ndcY * 0.5) * H,
      ndcX, ndcY, z: z / w, w
    };
  }

  // =========================================================================
  // 4. WEB WORKER SEAMLESS TERRAIN GENERATOR
  // =========================================================================
  const WORKER_SOURCE = `
  'use strict';
  function hash2(ix, iy, seed) {
    let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function grad2(ix, iy, seed, fx, fy) {
    const ang = hash2(ix, iy, seed) * 6.28318530718;
    return Math.cos(ang) * fx + Math.sin(ang) * fy;
  }
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function pNoise(u, v, period, seed) {
    const x = u * period;
    const y = v * period;
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = x - ix;
    const fy = y - iy;
    const x0 = ((ix % period) + period) % period;
    const y0 = ((iy % period) + period) % period;
    const x1 = (x0 + 1) % period;
    const y1 = (y0 + 1) % period;
    const sx = fade(fx);
    const sy = fade(fy);
    const n00 = grad2(x0, y0, seed, fx, fy);
    const n10 = grad2(x1, y0, seed, fx - 1, fy);
    const n01 = grad2(x0, y1, seed, fx, fy - 1);
    const n11 = grad2(x1, y1, seed, fx - 1, fy - 1);
    const nx0 = n00 + (n10 - n00) * sx;
    const nx1 = n01 + (n11 - n01) * sx;
    return nx0 + (nx1 - nx0) * sy; // roughly [-0.75, 0.75]
  }
  function fbm(u, v, basePeriod, octaves, seed) {
    let sum = 0, amp = 0.5, freq = basePeriod, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += pNoise(u, v, freq, seed + o * 31) * amp;
      norm += amp;
      freq *= 2;
      amp *= 0.5;
    }
    return sum / norm;
  }
  function ridged(u, v, basePeriod, octaves, seed) {
    let sum = 0, amp = 0.52, freq = basePeriod, norm = 0, weight = 1.0;
    for (let o = 0; o < octaves; o++) {
      let n = 1.0 - Math.abs(pNoise(u, v, freq, seed + o * 53) * 1.45);
      if (n < 0) n = 0;
      n = n * n * weight;
      weight = Math.min(1.0, Math.max(0.25, n * 1.65));
      sum += n * amp;
      norm += amp;
      freq *= 2;
      amp *= 0.48;
    }
    return sum / norm;
  }

  self.onmessage = function(e) {
    const msg = e.data;
    if (msg.phase === 'height') {
      const { res, yStart, yEnd, waterLevel } = msg;
      const rows = yEnd - yStart;
      const heights = new Float32Array(rows * res);
      const biomes = new Float32Array(rows * res);
      const conifers = new Float32Array(rows * res);

      for (let ly = 0; ly < rows; ly++) {
        const y = yStart + ly;
        const v = y / res;
        for (let x = 0; x < res; x++) {
          const u = x / res;
          // Domain warp for organic glacial fjords & lake coves
          const wx = fbm(u, v, 3, 3, 101) * 0.11;
          const wy = fbm(u, v, 3, 3, 211) * 0.11;
          const wu = u + wx;
          const wv = v + wy;

          // Macro lake basins & interconnected straits
          const basin = fbm(wu, wv, 3, 4, 307);
          const coveDetail = fbm(wu, wv, 8, 3, 409) * 0.28;
          const islands = Math.max(0, fbm(u, v, 6, 3, 521) - 0.12) * 0.32;

          let landMask = basin * 0.92 + coveDetail + islands + 0.04;

          // Dramatic alpine ridges away from lake centers
          const ridgeField = ridged(wu * 1.0, wv * 1.0, 4, 5, 613);
          const highPeakMask = Math.max(0, fbm(wu, wv, 2, 3, 733) * 1.25 + 0.18);

  function generateTerrainWithWorkers(onProgress) {
    return new Promise((resolve, reject) => {
      const workerCount = Math.min(Math.max(navigator.hardwareConcurrency || 4, 2), 4);
      const blob = new Blob([WORKER_SOURCE], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);

      const heights = new Float32Array(TERRAIN_RES * TERRAIN_RES);
      const biomes = new Float32Array(TERRAIN_RES * TERRAIN_RES);
      const conifers = new Float32Array(TERRAIN_RES * TERRAIN_RES);
      const shadows = new Float32Array(TERRAIN_RES * TERRAIN_RES);
      const normX = new Float32Array(TERRAIN_RES * TERRAIN_RES);
      const normZ = new Float32Array(TERRAIN_RES * TERRAIN_RES);

      const workers = [];
      const rowProgress = new Array(workerCount).fill(0);
      const chunk = Math.ceil(TERRAIN_RES / workerCount);

      let phase1Done = 0;
      let phase2Done = 0;

      function cleanup() {
        for (const w of workers) w.terminate();
        URL.revokeObjectURL(blobUrl);
      }

      function startShadowPhase() {
        rowProgress.fill(0);
        onProgress(0.58, 'BAKING LONG SUNSET SHADOWS...');
        for (let i = 0; i < workerCount; i++) {
          const yStart = i * chunk;
          const yEnd = Math.min(TERRAIN_RES, yStart + chunk);
          if (yStart >= TERRAIN_RES) { phase2Done++; continue; }
          workers[i].postMessage({
            phase: 'shadow',
            res: TERRAIN_RES,
            yStart, yEnd,
            heights,
            waterLevel: WATER_LEVEL_NORM,
            sunDir: SUN_DIR,
            tileSize: TILE_SIZE,
            minY: MIN_TERRAIN_Y,
            maxY: MAX_TERRAIN_Y
          });
        }
      }

      for (let i = 0; i < workerCount; i++) {
        const w = new Worker(blobUrl);
        workers.push(w);
        const yStart = i * chunk;
        const yEnd = Math.min(TERRAIN_RES, yStart + chunk);

        w.onerror = (err) => { cleanup(); reject(err); };
        w.onmessage = (e) => {
          const d = e.data;
          if (d.phase === 'progress') {
            rowProgress[i] = d.done;
            const totalDone = rowProgress.reduce((a, b) => a + b, 0);
            if (phase1Done < workerCount) {
              const frac = totalDone / TERRAIN_RES;
              onProgress(0.05 + frac * 0.53, frac < 0.5 ? 'GENERATING SEAMLESS HEIGHTFIELD...' : 'CARVING AUTUMN LAKE BASINS...');
            } else {
              const frac = totalDone / TERRAIN_RES;
              onProgress(0.58 + frac * 0.38, 'BAKING LONG SUNSET SHADOWS...');
            }
          } else if (d.phase === 'heightDone') {
            heights.set(d.heights, d.yStart * TERRAIN_RES);
            biomes.set(d.biomes, d.yStart * TERRAIN_RES);
            conifers.set(d.conifers, d.yStart * TERRAIN_RES);
            phase1Done++;
            if (phase1Done === workerCount) {
              startShadowPhase();
            }
          } else if (d.phase === 'shadowDone') {
            shadows.set(d.shadows, d.yStart * TERRAIN_RES);
            normX.set(d.normX, d.yStart * TERRAIN_RES);
            normZ.set(d.normZ, d.yStart * TERRAIN_RES);
            phase2Done++;
            if (phase2Done === workerCount) {
              onProgress(0.99, 'INITIALIZING FLIGHT SYSTEMS...');
              cleanup();
              resolve({ heights, biomes, conifers, shadows, normX, normZ });
            }
          }
        };

        if (yStart < TERRAIN_RES) {
          w.postMessage({
            phase: 'height',
            res: TERRAIN_RES,
            yStart, yEnd,
            waterLevel: WATER_LEVEL_NORM
          });
        } else {
          phase1Done++;
        }
      }
    });

    const fy = v * TERRAIN_RES;
    const x0 = Math.floor(fx) % TERRAIN_RES;
    const y0 = Math.floor(fy) % TERRAIN_RES;
    const x1 = (x0 + 1) % TERRAIN_RES;
    const y1 = (y0 + 1) % TERRAIN_RES;
    const tx = fx - Math.floor(fx);

      const data = buf.getChannelData(0);

        b1 = 0.985 * b1 + w * 0.032;

  float planeShadowMask(vec3 p) {
    if (p.y >= uPlanePos.y - 0.5) return 0.0;
    // Project along sun direction (clamped vertical so shadow stays readable near plane)
    vec3 sDir = normalize(vec3(uSunDir.x, max(uSunDir.y, 0.36), uSunDir.z));
    float t = (uPlanePos.y - p.y) / sDir.y;
    if (t < 0.0 || t > 620.0) return 0.0;
    vec3 hit = p + sDir * t;
    vec2 relXZ = hit.xz - uPlanePos.xz;
    vec2 fwd2 = normalize(uPlaneFwd.xz + vec2(1e-5, 0.0));
    vec2 right2 = vec2(-fwd2.y, fwd2.x);
    float along = dot(relXZ, fwd2);   // + forward, - tail
    float across = abs(dot(relXZ, right2));

    // Scale softly with height above surface
    float spread = 1.0 + t * 0.0014;
    float a = along / spread;
    float r = across / spread;
    // Swept delta wing + fuselage silhouette
    bool body = (a > -9.0 && a < 9.5 && r < 2.2);
    bool wing = (a > -5.5 && a < 3.2 && r < (8.2 - max(0.0, a + 1.5) * 1.45));
    bool tail = (a > -8.6 && a < -4.2 && r < 4.4);
    if (body || wing || tail) {
      return clamp(0.75 - t * 0.0008, 0.18, 0.72);
    }
    return 0.0;
  }

  // Directional sunset sky & horizon haze
  vec3 evalSky(vec3 rd, bool includeSunAndCirrus) {
    float elev = clamp(rd.y, -0.15, 1.0);
    float sunDot = dot(rd, uSunDir);
    float sunAlign = clamp(sunDot * 0.5 + 0.5, 0.0, 1.0);

    // Horizon color: warm golden-apricot toward sun, lilac-lavender away from sun
    vec3 horizAway = vec3(0.54, 0.42, 0.62);  // lilac mist
    vec3 horizSun  = vec3(0.98, 0.73, 0.46);  // warm sunset gold-apricot
    vec3 horizon = mix(horizAway, horizSun, pow(sunAlign, 1.55));

    // Mid-sky & zenith
    vec3 midAway = vec3(0.32, 0.24, 0.46);
    vec3 midSun  = vec3(0.84, 0.53, 0.51);    // dusty coral-rose
    vec3 midSky = mix(midAway, midSun, pow(sunAlign, 1.8));
    vec3 zenith = vec3(0.11, 0.09, 0.21);     // deep indigo twilight

    vec3 col = mix(horizon, midSky, smoothstep(0.0, 0.24, max(elev, 0.0)));
    col = mix(col, zenith, smoothstep(0.18, 0.74, max(elev, 0.0)));

    // Warm sun aureole
    float glow = pow(max(sunDot, 0.0), 7.0);
    col += vec3(0.32, 0.19, 0.08) * glow;

    if (includeSunAndCirrus) {
      // Wispy high-altitude cirrus streaks catching last peach/gold sunset light
      if (rd.y > 0.025) {
        vec2 skyUv = rd.xz / (rd.y + 0.14);
        vec2 cUv = skyUv * vec2(0.85, 2.6) + vec2(uTime * 0.005, 0.0);
        float w1 = fbm2(cUv + vec2(fbm2(cUv * 1.4) * 1.2, 0.0));
        float w2 = vnoise(cUv * vec2(2.8, 6.5) + vec2(3.1, 7.4));
        float wisp = smoothstep(0.56, 0.78, w1 * 0.72 + w2 * 0.38);
        wisp *= smoothstep(0.025, 0.14, rd.y) * smoothstep(0.72, 0.22, rd.y);
        vec3 wispCol = mix(vec3(0.76, 0.50, 0.56), vec3(1.0, 0.82, 0.58), pow(sunAlign, 1.3));
        col = mix(col, wispCol, wisp * 0.62);
      }

      // Large Sunset Sun Disk
      float sunAng = acos(clamp(sunDot, -1.0, 1.0));
      float disk = 1.0 - smoothstep(0.052, 0.062, sunAng);
      float halo = exp(-sunAng * 12.0) * 0.55;
      col = mix(col, vec3(1.0, 0.94, 0.76), halo);
      col = mix(col, vec3(1.0, 0.98, 0.88), disk);
    }
    return col;
  }

  vec3 applyHaze(vec3 col, vec3 rd, float dist) {
    float hazeT = 1.0 - exp(-dist * 0.00054);
    hazeT = clamp(hazeT * 0.96, 0.0, 0.95);
    float sunAlign = clamp(dot(rd, uSunDir) * 0.5 + 0.5, 0.0, 1.0);
    vec3 hazeLilac = vec3(0.52, 0.41, 0.60);
    vec3 hazeGold  = vec3(0.96, 0.71, 0.45);
    vec3 hazeCol = mix(hazeLilac, hazeGold, pow(sunAlign, 1.6));
    return mix(col, hazeCol, hazeT);
  }

  // Shade water surface
  vec3 shadeWater(vec3 p, vec3 rd, vec4 td, float dist) {
    float depthM = max(0.0, -heightToMeters(td.r));
    // Distinct depth bands from pale turquoise shoals to deep navy
    vec3 cShoal = vec3(0.45, 0.74, 0.70);
    vec3 cTeal  = vec3(0.24, 0.53, 0.58);
    vec3 cMid   = vec3(0.14, 0.30, 0.43);
    vec3 cDeep  = vec3(0.08, 0.14, 0.26);

    vec3 wCol = mix(cShoal, cTeal, smoothstep(1.2, 6.5, depthM));
    wCol = mix(wCol, cMid, smoothstep(6.0, 16.0, depthM));
    wCol = mix(wCol, cDeep, smoothstep(15.0, 32.0, depthM));

    // Wave normal perturbation
    vec2 wp1 = p.xz * 0.16 + vec2(uTime * 0.45, uTime * 0.22);
    vec2 wp2 = p.xz * 0.34 - vec2(uTime * 0.31, -uTime * 0.48);
    float n1 = vnoise(wp1);
    float n2 = vnoise(wp2);
    vec3 N = normalize(vec3((n1 - 0.5) * 0.16 + (n2 - 0.5) * 0.11, 1.0, (n2 - 0.5) * 0.16 - (n1 - 0.5) * 0.11));

    // Baked mountain shadow + live cumulus cloud shadow + plane shadow
    float mShadow = td.g;
    float tCloud = (CLOUD_BASE - p.y) / max(uSunDir.y, 0.12);
    float cShadow = 1.0 - cloudDensity2D(p.xz + uSunDir.xz * tCloud) * 0.65;
    float pShadow = 1.0 - planeShadowMask(p);
    float sunVis = clamp(mShadow * cShadow * pShadow, 0.0, 1.0);

    // Shadowed water turns deeper violet-navy
    wCol = mix(wCol * vec3(0.46, 0.40, 0.64), wCol, 0.25 + 0.75 * sunVis);

    // Low-angle sky reflection (Fresnel)
    vec3 V = -rd;
    vec3 R = reflect(rd, N);
    R.y = abs(R.y);
    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.2);
    vec3 reflSky = evalSky(R, false);
    wCol = mix(wCol, reflSky, clamp(fresnel * 0.78 + 0.06, 0.0, 0.85));

    // Glittering golden sun path across water
    float specAlign = max(dot(R, uSunDir), 0.0);
    float sunPath = pow(specAlign, 22.0) * 0.85 + pow(specAlign, 110.0) * 1.45;
    float waveGlint = smoothstep(0.42, 0.86, n1 * 0.6 + n2 * 0.4);
    wCol += vec3(1.0, 0.86, 0.54) * sunPath * (0.45 + 0.85 * waveGlint) * sunVis;

    // Brief crisp 1-pixel white water sparkles
    vec2 spCell = floor(p.xz * 1.35);
    float spPhase = hash21(spCell) * 6.2831 + uTime * (2.8 + hash21(spCell + 7.1) * 3.2);
    float spPulse = pow(max(0.0, sin(spPhase)), 34.0);
    float spMask = step(0.88, hash21(spCell + floor(uTime * 1.8))) * spPulse * sunVis * smoothstep(1300.0, 90.0, dist);
    wCol = mix(wCol, vec3(1.0, 0.99, 0.95), clamp(spMask, 0.0, 1.0));

    // Animated shoreline foam lapping along beaches/islets
    float foamWave = sin(depthM * 2.2 - uTime * 2.4 + n1 * 3.5) * 0.5 + 0.5;
    float shoreFoam = smoothstep(3.4, 0.25, depthM) * smoothstep(0.32, 0.78, foamWave + smoothstep(1.2, 0.0, depthM) * 0.7);
    vec3 foamCol = mix(vec3(0.68, 0.62, 0.74), vec3(0.95, 0.91, 0.82), 0.35 + 0.65 * sunVis);
    wCol = mix(wCol, foamCol, shoreFoam * 0.88);

    // Water impacts (expanding foam rings + flash illumination)
    for (int i = 0; i < ${MAX_IMPACTS}; i++) {
      float age = uImpacts[i].w;
      if (age <= 0.0) continue;
      float d = length(p.xz - uImpacts[i].xz);
      float isW = uImpactMeta[i].x;
      float flash = uImpactMeta[i].z;
      if (flash > 0.01 && d < 95.0) {
        wCol += vec3(1.0, 0.74, 0.38) * flash * (1.0 - d / 95.0) * 0.85;
      }
      if (isW > 0.5 && age < 22.0) {
        float ringR = 5.0 + age * 8.5;
        float ring = exp(-pow((d - ringR) * 0.26, 2.0)) * clamp(1.0 - age / 9.0, 0.0, 1.0);
        float centerFoam = exp(-d * 0.085) * clamp(1.0 - age / 18.0, 0.0, 1.0) * (0.6 + 0.4 * n2);
        wCol = mix(wCol, vec3(0.94, 0.93, 0.88), clamp(ring * 0.9 + centerFoam * 0.85, 0.0, 1.0));
      }
    }

    // Low-altitude aircraft wake foam directly on water surface
    if (uPlanePos.y < 30.0) {
      vec2 rel = p.xz - uPlanePos.xz;
      vec2 fwd2 = normalize(uPlaneFwd.xz + vec2(1e-5, 0.0));
      vec2 right2 = vec2(-fwd2.y, fwd2.x);
      float behind = -dot(rel, fwd2);
      float side = abs(dot(rel, right2));
      if (behind > -4.0 && behind < 135.0) {
        float spread = 2.6 + behind * 0.14;
        float wakeEdge = exp(-pow((side - spread) * 0.45, 2.0)) + 0.45 * exp(-side * 0.24);
        float wakeFade = smoothstep(135.0, 8.0, behind) * smoothstep(-4.0, 6.0, behind) * (1.0 - uPlanePos.y / 30.0);
        wCol = mix(wCol, vec3(0.95, 0.94, 0.90), clamp(wakeEdge * wakeFade * (0.65 + 0.35 * n1), 0.0, 0.9));
      }
    }

    return wCol;
  }

  // Shade terrain land surface
  vec3 shadeLand(vec3 p, vec3 rd, vec4 td, vec4 tb, float dist) {
    float hM = max(0.0, p.y);
    vec2 nXZ = tb.rg * 2.0 - 1.0;
    float ny = sqrt(max(0.02, 1.0 - dot(nXZ, nXZ)));
    vec3 N = normalize(vec3(nXZ.x, ny, nXZ.y));
    float slope = 1.0 - N.y;

    float biome = td.b;
    float coniferVal = td.a;
    float crownNoise = vnoise(p.xz * 0.17);
    float microNoise = vnoise(p.xz * 0.48);

    // Base biome layering: sand -> pale grass -> patchy autumn forest -> grey-purple rock -> snow peaks
    vec3 sandCol   = vec3(0.84, 0.70, 0.50);
    vec3 grassCol  = mix(vec3(0.58, 0.54, 0.34), vec3(0.70, 0.62, 0.38), crownNoise);

    // Patchy autumn deciduous palette (deep crimson, burnt orange, vibrant golden birch)
    vec3 fCrimson = vec3(0.74, 0.17, 0.24);
    vec3 fOrange  = vec3(0.90, 0.44, 0.16);
    vec3 fGold    = vec3(0.97, 0.68, 0.24);
    vec3 fRusset  = vec3(0.68, 0.28, 0.16);
    vec3 forestCol;
    if (biome < 0.36) {
      forestCol = mix(fCrimson, fRusset, smoothstep(0.24, 0.36, biome));
    } else if (biome < 0.62) {
      forestCol = mix(fRusset, fOrange, smoothstep(0.38, 0.54, biome));
    } else {
      forestCol = mix(fOrange, fGold, smoothstep(0.62, 0.76, biome));
    }
    // Crisp canopy crown dappling
    forestCol *= (0.76 + 0.42 * crownNoise);

    // Scattered dark conifer pines (dotted in groves & stronger on higher ridges)
    float pineProb = coniferVal + smoothstep(42.0, 108.0, hM) * 0.26 - 0.58;
    float isConifer = smoothstep(0.0, 0.12, pineProb + (microNoise - 0.5) * 0.32);
    vec3 coniferCol = mix(vec3(0.11, 0.17, 0.16), vec3(0.22, 0.29, 0.22), microNoise);

    vec3 rockCol = mix(vec3(0.38, 0.33, 0.45), vec3(0.57, 0.51, 0.62), crownNoise);
    vec3 snowCol = vec3(0.98, 0.90, 0.85);

    // Assemble altitude & slope biomes
    vec3 albedo = sandCol;
    albedo = mix(albedo, grassCol, smoothstep(2.4, 7.5, hM));

    // Forest band (9m..114m on moderate slopes)
    float forestMask = smoothstep(7.5, 18.0, hM) * smoothstep(122.0, 90.0, hM) * smoothstep(0.38, 0.17, slope);
    vec3 woods = mix(forestCol, coniferCol, isConifer * 0.92);
    albedo = mix(albedo, woods, forestMask);

    // Exposed grey-purple alpine rock on steep cliffs & high elevation
    float rockMask = max(smoothstep(0.21, 0.40, slope), smoothstep(96.0, 128.0, hM));
    albedo = mix(albedo, rockCol, clamp(rockMask, 0.0, 1.0));

    // Snow on highest peaks (accumulates on summits & upper alpine ledges)
    float snowLine = 114.0 + (crownNoise - 0.5) * 16.0 + slope * 30.0;
    float snowMask = smoothstep(snowLine - 7.0, snowLine + 9.0, hM);
    albedo = mix(albedo, snowCol, snowMask);

    // Subtle stepped / terraced shading + long baked sunset shadows + live cloud & plane shadows
    float ndl = max(dot(N, uSunDir), 0.0);
    // Subtle terraced toon-stepped diffuse light
    float steppedNdl = mix(ndl, floor(ndl * 4.0 + 0.35) / 4.0, 0.58);

    float bakedShadow = td.g;
    float tCloud = max(0.0, (CLOUD_BASE - p.y) / max(uSunDir.y, 0.12));
    float cloudShadow = (p.y < CLOUD_BASE) ? (1.0 - cloudDensity2D(p.xz + uSunDir.xz * tCloud) * 0.72) : 1.0;
    float pShadow = 1.0 - planeShadowMask(p);
    float lightVis = clamp(bakedShadow * cloudShadow * pShadow, 0.0, 1.0);

    vec3 sunLight = vec3(1.24, 0.89, 0.62) * (0.20 + 1.02 * steppedNdl) * lightVis;
    // Rich violet sunset shadow ambient (dramatic sunset contrast!)
    vec3 shadowAmb = mix(vec3(0.22, 0.15, 0.36), vec3(0.39, 0.30, 0.53), N.y * 0.6 + 0.4);
    vec3 col = albedo * (shadowAmb + sunLight);

    // Cool lavender-violet tint on shadowed snow peaks, warm sunset rose-cream on sunlit peaks
    if (snowMask > 0.2) {
      vec3 snowShade = vec3(0.52, 0.46, 0.68);
      col = mix(col, mix(snowShade, vec3(0.99, 0.90, 0.82), clamp(steppedNdl * lightVis * 1.45, 0.0, 1.0)), snowMask * 0.55);
    }

    // Scorch marks, glowing embers & impact flash on land
    for (int i = 0; i < ${MAX_IMPACTS}; i++) {
      float age = uImpacts[i].w;
      if (age <= 0.0) continue;
      float d = length(p.xz - uImpacts[i].xz);
      float isW = uImpactMeta[i].x;
      float flash = uImpactMeta[i].z;
      if (flash > 0.01 && d < 105.0) {
        col += vec3(1.0, 0.72, 0.34) * flash * (1.0 - d / 105.0) * 1.1;
      }
      if (isW < 0.5 && age < 45.0 && d < 28.0) {
        float fadeOut = clamp(1.0 - max(0.0, age - 25.0) / 20.0, 0.0, 1.0);
        float scorch = smoothstep(22.0 + crownNoise * 6.0, 4.0, d) * fadeOut;
        col = mix(col, vec3(0.09, 0.07, 0.12), scorch * 0.88);
        // Flickering glowing embers inside crater
        float emberPulse = 0.55 + 0.45 * sin(uTime * 7.5 + microNoise * 12.0 + float(i) * 2.1);
        float ember = smoothstep(12.5, 2.0, d) * step(0.62, microNoise) * clamp(1.0 - age / 24.0, 0.0, 1.0);
        col = mix(col, vec3(1.0, 0.52, 0.14), ember * emberPulse);
      }
    }

    return col;
  }

  void main() {
    // Reconstruct world ray from screen UV
    vec2 ndc = vUv * 2.0 - 1.0;
    vec4 nearP = uInvViewProj * vec4(ndc, -1.0, 1.0);
    vec4 farP  = uInvViewProj * vec4(ndc,  1.0, 1.0);
    nearP /= nearP.w;
    farP  /= farP.w;
    vec3 ro = uCamPos;
    vec3 rd = normalize(farP.xyz - nearP.xyz);

    // 1. Raymarch Terrain & Water
    float maxDist = 3000.0;
    float tHit = -1.0;
    bool hitWater = false;

    float tWater = (ro.y > 0.0 && rd.y < -1e-4) ? (-ro.y / rd.y) : 1e9;
    float tStart = 0.5;
    if (ro.y > MAX_TERRAIN_Y + 2.0) {
      if (rd.y >= -1e-4) {
        tStart = maxDist + 1.0; // looking up above all terrain
      } else {
        tStart = max(0.5, (MAX_TERRAIN_Y + 2.0 - ro.y) / rd.y);
      }
    }

    float tLimit = min(maxDist, tWater + 4.0);
    float t = tStart;
    float tPrev = tStart;

    if (tStart < tLimit) {
      for (int i = 0; i < 104; i++) {
        if (t >= tLimit) break;
        vec3 p = ro + rd * t;
        float h = sampleHeightM(p.xz);
        float diff = p.y - h;
        if (diff <= 0.0) {
          // 6-step binary search for crisp, artifact-free ridge silhouettes
          float lo = tPrev;
          float hi = t;
          for (int b = 0; b < 6; b++) {
            float mid = 0.5 * (lo + hi);
            vec3 mp = ro + rd * mid;
            if (mp.y - sampleHeightM(mp.xz) <= 0.0) hi = mid;
            else lo = mid;
          }
          tHit = hi;
          break;
        }
        tPrev = t;
        float stepSz = max(diff * 0.44, 1.4 + t * 0.0145);
        t += stepSz;
      }
    }

    if ((tHit < 0.0 || tWater < tHit) && tWater > 0.0 && tWater < maxDist) {
      // Confirm terrain at water intersection is below water level
      vec3 wp = ro + rd * tWater;
      if (sampleHeightM(wp.xz) <= 0.05) {
        tHit = tWater;
        hitWater = true;
      }
    }

    vec3 bgCol;
    float solidDist = 1e6;
    if (tHit > 0.0) {
      vec3 hitP = ro + rd * tHit;
      vec4 td = sampleTerrainData(hitP.xz);
      if (hitWater) {
        bgCol = shadeWater(hitP, rd, td, tHit);
      } else {
        vec4 tb = texture(uTerrainB, hitP.xz / TILE_SIZE);
        bgCol = shadeLand(hitP, rd, td, tb, tHit);
      }
      bgCol = applyHaze(bgCol, rd, tHit);
      solidDist = tHit;
    } else {
      bgCol = evalSky(rd, true);
    }

    // 2. Raymarch Fluffy Cumulus Cloud Layer below cruising altitude [CLOUD_BASE..CLOUD_TOP]
    float cloudAlpha = 0.0;
    vec3 cloudCol = vec3(0.0);
    float cloudDepthDist = 1e6;

    float cT0 = -1.0;
    float cT1 = -1.0;
    if (abs(rd.y) > 1e-4) {
      float ta = (CLOUD_BASE - ro.y) / rd.y;
      float tb = (CLOUD_TOP - ro.y) / rd.y;
      cT0 = max(0.5, min(ta, tb));
      cT1 = min(solidDist, min(2600.0, max(ta, tb)));
    } else if (ro.y >= CLOUD_BASE && ro.y <= CLOUD_TOP) {
      cT0 = 0.5;
      cT1 = min(solidDist, 1400.0);
    }

    if (cT1 > cT0) {
      cT1 = min(cT1, cT0 + 950.0);
      const int C_STEPS = 14;
      float dt = (cT1 - cT0) / float(C_STEPS);
      // Ordered 4x4 Bayer jitter (zero TV-static speckle when viewing clouds near horizon!)
      ivec2 bpx = ivec2(gl_FragCoord.xy) & 3;
      const float BM[16] = float[16](
         0.0,  8.0,  2.0, 10.0,
        12.0,  4.0, 14.0,  6.0,
         3.0, 11.0,  1.0,  9.0,
        15.0,  7.0, 13.0,  5.0
      );
      float jitter = (BM[bpx.y * 4 + bpx.x] / 16.0) * min(dt, 28.0);
      for (int i = 0; i < C_STEPS; i++) {
        float ct = cT0 + (float(i) + 0.15) * dt + jitter * 0.45;
        if (ct >= solidDist) break;
        vec3 cp = ro + rd * ct;
        float distFade = smoothstep(2250.0, 750.0, ct);
        if (distFade <= 0.01) break;
        float hFrac = (cp.y - CLOUD_BASE) / (CLOUD_TOP - CLOUD_BASE); // 0 bottom .. 1 top
        float baseD = cloudDensity2D(cp.xz);
        // Puffy cumulus dome shape: flat bottom, billowing rounded domes
        float dome = smoothstep(0.0, 0.14, hFrac) * smoothstep(1.0, 0.16, hFrac / max(baseD * 1.15, 0.05));
        float d = clamp((baseD - 0.06) * dome * 3.1, 0.0, 1.0) * distFade;
        if (d > 0.04) {
          // 1-tap sunward lighting + vertical stepped cumulus shading
          float sunSample = cloudDensity2D(cp.xz + uSunDir.xz * 32.0);
          float lit = clamp(hFrac * 0.72 + (1.0 - sunSample) * 0.56, 0.0, 1.0);
          // Stepped pixel-art cloud tones (violet underside -> mauve -> rose -> warm peach crown)
          vec3 cStep;
          if (lit < 0.28)      cStep = vec3(0.29, 0.19, 0.36);
          else if (lit < 0.52) cStep = vec3(0.52, 0.34, 0.48);
          else if (lit < 0.75) cStep = vec3(0.84, 0.52, 0.52);
          else                 cStep = vec3(0.99, 0.76, 0.59);

          // Aircraft shadow cast onto clouds!
          float pSh = planeShadowMask(cp);
          cStep = mix(cStep, vec3(0.20, 0.13, 0.28), pSh * 0.78);

          cStep = applyHaze(cStep, rd, ct);
          float a = clamp(d * 0.72, 0.0, 0.96);
          cloudCol += (1.0 - cloudAlpha) * a * cStep;
          cloudAlpha += (1.0 - cloudAlpha) * a;
          if (cloudDepthDist > 5e5 && cloudAlpha > 0.45) {
            cloudDepthDist = ct;
          }
          if (cloudAlpha > 0.96) break;
        }
      }
    }

    vec3 finalCol = mix(bgCol, cloudCol / max(cloudAlpha, 0.001), cloudAlpha);
    float finalDist = min(solidDist, cloudDepthDist);

    // Write accurate clip-space depth for 3D aircraft, missiles & FX occlusion!
    if (finalDist < 5e5) {
      vec3 wp = ro + rd * finalDist;
      vec4 clip = uViewProj * vec4(wp, 1.0);
      gl_FragDepth = clamp((clip.z / clip.w) * 0.5 + 0.5, 0.0001, 0.99995);
    } else {
      gl_FragDepth = 0.99998;
    }

    outColor = vec4(finalCol, 1.0); // alpha 1.0 => full Bayer dither on world
    outMask = vec4(0.0);            // not aircraft
  }`;

  // Pass 2a: Flat 3-Tone Shaded Low-Poly Aircraft & Missiles Shader
  const VS_MESH = `#version 300 es
  precision highp float;
  layout(location = 0) in vec3 aPos;
  layout(location = 1) in vec3 aNormal;
  layout(location = 2) in vec3 aColor;
  layout(location = 3) in float aEmissive;

  uniform mat4 uViewProj;
  uniform mat4 uModel;

  out vec3 vNormal;
  out vec3 vColor;
  out float vEmissive;

  void main() {
    vec4 wp = uModel * vec4(aPos, 1.0);
    vNormal = normalize(mat3(uModel) * aNormal);
    vColor = aColor;
    vEmissive = aEmissive;
    gl_Position = uViewProj * wp;
  }`;

  const FS_MESH = `#version 300 es
  precision highp float;
  in vec3 vNormal;
  in vec3 vColor;
  in float vEmissive;

  uniform vec3 uSunDir;
  uniform float uBurnerGlow;
  uniform float uMaskId;

  layout(location = 0) out vec4 outColor;
  layout(location = 1) out vec4 outMask;

  void main() {
    vec3 N = normalize(vNormal);
    float ndl = dot(N, uSunDir);
    vec3 col;
    if (vEmissive > 0.5) {
      // Glowing exhaust nozzle interior
      col = mix(vec3(0.95, 0.38, 0.16), vec3(1.0, 0.95, 0.72), clamp(0.25 + uBurnerGlow * 0.75, 0.0, 1.0));
    } else {
      // Crisp 3-tone flat shading (shadow, midtone, warm sunlit highlight)
      if (ndl < -0.05) {
        col = vColor * vec3(0.56, 0.52, 0.70); // violet-cool shadow tone
      } else if (ndl < 0.42) {
        col = vColor * vec3(0.92, 0.89, 0.92); // clean midtone
      } else {
        col = min(vec3(1.0), vColor * vec3(1.22, 1.14, 1.04) + vec3(0.07, 0.04, 0.01)); // sunset highlight
      }
    }
    outColor = vec4(col, 0.0);    // alpha 0.0 => crisp un-dithered flat palette color!
    outMask = vec4(uMaskId, 0.0, 0.0, 1.0);
  }`;

  // Pass 2b: 3D FX Triangles (Afterburner Plumes, Vapor Trails, Explosions, Smoke, Shockwave Rings, Water Spray)
  const VS_FX = `#version 300 es
  precision highp float;
  layout(location = 0) in vec3 aPos;
  layout(location = 1) in vec4 aColor;

  uniform mat4 uViewProj;
  out vec4 vColor;

  void main() {
    vColor = aColor;
    gl_Position = uViewProj * vec4(aPos, 1.0);
  }`;

  const FS_FX = `#version 300 es
  precision highp float;
  in vec4 vColor;
  layout(location = 0) out vec4 outColor;
  void main() {
    outColor = vColor;
  }`;

  // Pass 3: Post-Process (Exact 1px Dark Outline on Aircraft + 4x4 Ordered Bayer Dithering + Curated 48-Color Palette Quantization)
  const FS_POST = `#version 300 es
  precision highp float;
  in vec2 vUv;
  out vec4 fragColor;

  uniform sampler2D uColorTex;
  uniform sampler2D uMaskTex;
  uniform vec2 uTexel;
  uniform vec3 uPalette[48];
  uniform float uFlash;

  // Ordered 4x4 Bayer matrix normalized to [-0.5, +0.5]
  float bayer4(ivec2 p) {
    int x = p.x & 3;
    int y = p.y & 3;
    int idx = y * 4 + x;
    const float M[16] = float[16](
       0.0,  8.0,  2.0, 10.0,
      12.0,  4.0, 14.0,  6.0,
       3.0, 11.0,  1.0,  9.0,
      15.0,  7.0, 13.0,  5.0
    );
    return (M[idx] + 0.5) / 16.0 - 0.5;
  }

  vec3 quantizePalette(vec3 col) {
    float bestD = 1e9;
    vec3 bestC = uPalette[0];
    for (int i = 0; i < 48; i++) {
      vec3 diff = col - uPalette[i];
      // Perceptual redmean-weighted distance for clean hue preservation
      vec3 w = vec3(2.3, 4.0, 2.8);
      float d = dot(diff * diff, w);
      if (d < bestD) {
        bestD = d;
        bestC = uPalette[i];
      }
    }
    return bestC;
  }

  void main() {
    vec4 src = texture(uColorTex, vUv);
    float mC = texture(uMaskTex, vUv).r;

    // Exact 1-pixel dark ink outline around aircraft (and missiles)
    if (mC < 0.25) {
      float mL = texture(uMaskTex, vUv + vec2(-uTexel.x, 0.0)).r;
      float mR = texture(uMaskTex, vUv + vec2( uTexel.x, 0.0)).r;
      float mU = texture(uMaskTex, vUv + vec2(0.0,  uTexel.y)).r;
      float mD = texture(uMaskTex, vUv + vec2(0.0, -uTexel.y)).r;
      if (max(max(mL, mR), max(mU, mD)) > 0.5) {
        fragColor = vec4(uPalette[0], 1.0); // #171224 crisp 1px dark outline
        return;
      }
    }

    vec3 col = src.rgb + vec3(uFlash * 0.26, uFlash * 0.16, uFlash * 0.06);
    float ditherAmt = src.a; // 1.0 for world/clouds/water/sky, 0.0 for crisp flat-shaded aircraft

    ivec2 px = ivec2(gl_FragCoord.xy);
    float b = bayer4(px);
    // Ordered 4x4 Bayer threshold offset before limited-palette quantization
    vec3 dithered = clamp(col + vec3(b * 0.095 * ditherAmt), 0.0, 1.0);
    vec3 finalCol = quantizePalette(dithered);

    fragColor = vec4(finalCol, 1.0);
  }`;

  // =========================================================================
  // 7. PROCEDURAL LOW-POLY FIGHTER JET & MISSILE MESHES
  // =========================================================================
  function buildMeshBuilder() {
    const verts = []; // [x,y,z, nx,ny,nz, r,g,b, emissive]
    function pushTri(a, b, c, hex, emissive = 0.0) {
      const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
      const ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      const n = v3Norm(v3Cross(ab, ac));
      const col = hexToRgb01(hex);
      for (const p of [a, b, c]) {
        verts.push(p[0], p[1], p[2], n[0], n[1], n[2], col[0], col[1], col[2], emissive);
      }
    }
    function pushQuad(a, b, c, d, hex, emissive = 0.0) {
      pushTri(a, b, c, hex, emissive);
      pushTri(a, c, d, hex, emissive);
    }
    function mirrorX(p) { return [-p[0], p[1], p[2]]; }
    function pushSymTri(a, b, c, hexL, hexR = hexL, emissive = 0.0) {
      pushTri(a, b, c, hexR, emissive);
      pushTri(mirrorX(a), mirrorX(c), mirrorX(b), hexL, emissive);
    }
    function pushSymQuad(a, b, c, d, hexL, hexR = hexL, emissive = 0.0) {
      pushQuad(a, b, c, d, hexR, emissive);
      pushQuad(mirrorX(a), mirrorX(d), mirrorX(c), mirrorX(b), hexL, emissive);
    }
    return { pushTri, pushQuad, pushSymTri, pushSymQuad, toArray: () => new Float32Array(verts) };
  }

  function createFighterMesh() {
    const m = buildMeshBuilder();
    const C_RADOME = '#2c3242';
    const C_LIGHT  = '#b6c0cf';
    const C_MID    = '#7e899c';
    const C_DARK   = '#4d5669';
    const C_GOLD   = '#f5b53d';
    const C_GLINT  = '#ffe5a3';
    const C_RED    = '#d93843';
    const C_NOZZLE = '#2c3242';
    const C_GLOW   = '#f25c2a';

    // Local space: -Z is Nose, +Z is Tail, +Y is Up, +X is Right Wing
    // 1. Sharp Dark Radome Nose Cone
    const noseTip = [0, -0.05, -9.8];
    const rT  = [0,  0.52, -5.6];
    const rB  = [0, -0.45, -5.6];
    const rR  = [0.85, 0.02, -5.6];
    m.pushSymTri(noseTip, rR, rT, C_RADOME, C_RADOME);
    m.pushSymTri(noseTip, rB, rR, C_RADOME, C_RADOME);

    // 2. Forward Fuselage & LERX Chines
    const fT1 = [0,  0.65, -2.0];
    const fR1 = [1.55, 0.14, -2.2];
    const fB1 = [0, -0.55, -2.0];
    m.pushSymQuad(rT, rR, fR1, fT1, C_LIGHT, C_MID);
    m.pushSymQuad(rR, rB, fB1, fR1, C_MID, C_MID);

    // 3. Center Spine & Twin Engine Dorsal Fuselage (Splinter Camo Panels)
    const sT2 = [0,  0.86,  1.6];
    const sT3 = [0,  0.70,  5.6];
    const sR2 = [2.25, 0.45,  1.6];
    const sR3 = [2.10, 0.35,  6.2];
    const sB2 = [0, -0.52,  1.8];
    const sB3 = [0, -0.42,  6.0];
    // Asymmetric splinter camo across dorsal spine
    m.pushTri(fT1, fR1, sR2, C_DARK);
    m.pushTri(fT1, sR2, sT2, C_LIGHT);
    m.pushTri([-fT1[0], fT1[1], fT1[2]], [-sR2[0], sR2[1], sR2[2]], [-fR1[0], fR1[1], fR1[2]], C_LIGHT);
    m.pushTri([-fT1[0], fT1[1], fT1[2]], [-sT2[0], sT2[1], sT2[2]], [-sR2[0], sR2[1], sR2[2]], C_DARK);

    m.pushTri(sT2, sR2, sR3, C_LIGHT);
    m.pushTri(sT2, sR3, sT3, C_MID);
    m.pushTri([-sT2[0], sT2[1], sT2[2]], [-sR3[0], sR3[1], sR3[2]], [-sR2[0], sR2[1], sR2[2]], C_MID);
    m.pushTri([-sT2[0], sT2[1], sT2[2]], [-sT3[0], sT3[1], sT3[2]], [-sR3[0], sR3[1], sR3[2]], C_LIGHT);

    // Belly fuselage
    m.pushSymQuad(fR1, fB1, sB2, sR2, C_DARK, C_DARK);
    m.pushSymQuad(sR2, sB2, sB3, sR3, C_DARK, C_DARK);
    // Tail bulkhead
    m.pushSymTri(sT3, sR3, sB3, C_NOZZLE, C_NOZZLE);

    // 4. Gold-Tinted Bubble Canopy
    const cFront = [0,  0.54, -5.55];
    const cPeak  = [0,  1.58, -3.25];
    const cBack  = [0,  0.90, -0.60];
    const cSideF = [0.64, 0.70, -3.9];
    const cSideM = [0.76, 0.80, -2.5];
    const cSideB = [0.46, 0.72, -1.1];
    m.pushSymTri(cFront, cSideF, cPeak, C_GLINT, C_GOLD);
    m.pushSymQuad(cPeak, cSideF, cSideM, cBack, C_GOLD, C_GOLD);
    m.pushSymTri(cBack, cSideM, cSideB, C_GOLD, C_GOLD);
    // Dark canopy sill frame
    m.pushSymQuad(cFront, [0.72, 0.34, -4.1], cSideF, cFront, C_RADOME, C_RADOME);

    // 5. Twin Side Air Intakes
    const inTopO = [2.15, 0.25, -1.9];
    const inTopI = [1.30, 0.28, -1.9];
    const inBotO = [2.05, -0.45, -1.6];
    const inBotI = [1.15, -0.45, -1.6];
    const inRearT = [2.25, 0.42, 4.6];
    const inRearB = [2.10, -0.40, 4.6];
    m.pushSymQuad(inTopI, inTopO, inBotO, inBotI, C_RADOME, C_RADOME); // Dark intake mouth
    m.pushSymQuad(inTopO, inRearT, inRearB, inBotO, C_DARK, C_MID);

    // 6. Clipped Delta Wings with Crisp Geometric Splinter Camouflage
    // Right wing vertices (mirrored with different camo pattern for Left wing!)
    const wRootF  = [1.95,  0.22, -1.7];
    const wMidF   = [4.65,  0.10,  0.35];
    const wTipF   = [7.80, -0.05,  2.55];
    const wTipR   = [7.80, -0.08,  4.15];
    const wMidR   = [4.85,  0.04,  4.45];
    const wRootR  = [2.15,  0.15,  4.65];
    const wCenter = [4.55,  0.16,  2.35];

    const wRootFB  = [1.95, -0.18, -1.7];
    const wTipFB   = [7.80, -0.18,  2.55];
    const wTipRB   = [7.80, -0.18,  4.15];
    const wRootRB  = [2.15, -0.18,  4.65];

    // Right wing TOP splinter panels (5 sharp angular camo facets)
    m.pushTri(wRootF, wMidF, wCenter, C_LIGHT);
    m.pushTri(wMidF, wTipF, wCenter, C_DARK);
    m.pushTri(wTipF, wTipR, wCenter, C_MID);
    m.pushTri(wCenter, wTipR, wMidR, C_LIGHT);
    m.pushTri(wCenter, wMidR, wRootR, C_DARK);
    m.pushTri(wRootF, wCenter, wRootR, C_MID);

    // Left wing TOP splinter panels (distinct asymmetric camo!)
    const mx = (p) => [-p[0], p[1], p[2]];
    m.pushTri(mx(wRootF), mx(wCenter), mx(wMidF), C_MID);
    m.pushTri(mx(wMidF), mx(wCenter), mx(wTipF), C_LIGHT);
    m.pushTri(mx(wTipF), mx(wCenter), mx(wTipR), C_DARK);
    m.pushTri(mx(wCenter), mx(wMidR), mx(wTipR), C_MID);
    m.pushTri(mx(wCenter), mx(wRootR), mx(wMidR), C_LIGHT);
    m.pushTri(mx(wRootF), mx(wRootR), mx(wCenter), C_DARK);

    // Wing Bottom & Edges (both sides)
    m.pushSymQuad(wRootFB, wRootRB, wTipRB, wTipFB, C_DARK, C_DARK);
    m.pushSymQuad(wRootF, wRootFB, wTipFB, wTipF, C_MID, C_MID);   // Leading edge
    m.pushSymQuad(wTipF, wTipFB, wTipRB, wTipR, C_LIGHT, C_LIGHT); // Clipped wingtip
    m.pushSymQuad(wTipR, wTipRB, wRootRB, wRootR, C_DARK, C_DARK); // Trailing edge

    // 7. Canted Twin Vertical Tails with Red Cap Tips
    const tRootF = [1.80, 0.42, 2.75];
    const tRootR = [1.80, 0.36, 6.45];
    const tCapF  = [2.88, 2.78, 4.95];
    const tCapR  = [2.88, 2.72, 6.95];
    const tTopF  = [3.16, 3.45, 5.45];
    const tTopR  = [3.16, 3.38, 7.12];
    const thick  = 0.14;
    const offO = (p) => [p[0] + thick, p[1], p[2]];
    const offI = (p) => [p[0] - thick, p[1], p[2]];

    // Lower main fin body (outer & inner faces)
    m.pushSymQuad(offO(tRootF), offO(tCapF), offO(tCapR), offO(tRootR), C_MID, C_DARK);
    m.pushSymQuad(offI(tRootR), offI(tCapR), offI(tCapF), offI(tRootF), C_LIGHT, C_MID);
    // Red cap tips!
    m.pushSymQuad(offO(tCapF), offO(tTopF), offO(tTopR), offO(tCapR), C_RED, C_RED);
    m.pushSymQuad(offI(tCapR), offI(tTopR), offI(tTopF), offI(tCapF), C_RED, C_RED);
    m.pushSymQuad(offI(tTopF), offO(tTopF), offO(tTopR), offI(tTopR), C_RED, C_RED);
    // Fin leading & trailing edges
    m.pushSymQuad(offI(tRootF), offI(tTopF), offO(tTopF), offO(tRootF), C_DARK, C_DARK);
    m.pushSymQuad(offO(tRootR), offO(tTopR), offI(tTopR), offI(tRootR), C_DARK, C_DARK);

    // 8. Twin Horizontal Stabilators
    const hRF = [2.05, 0.12, 5.10];
    const hTF = [4.55, 0.02, 6.55];
    const hTR = [4.55, 0.00, 7.55];
    const hRR = [2.00, 0.08, 7.15];
    const hRFb = [2.05, -0.08, 5.10];
    const hTFb = [4.55, -0.08, 6.55];
    const hTRb = [4.55, -0.08, 7.55];
    const hRRb = [2.00, -0.08, 7.15];
    m.pushSymQuad(hRF, hTF, hTR, hRR, C_MID, C_LIGHT);
    m.pushSymQuad(hRFb, hRRb, hTRb, hTFb, C_DARK, C_DARK);

    // 9. Twin Glowing Exhaust Nozzles
    const segs = 8;
    for (const side of [-1, 1]) {
      const cx = side * 1.12;
      const cy = 0.0;
      const z0 = 6.0;
      const z1 = 7.65;
      const r0 = 0.68;
      const r1 = 0.56;
      const rInner = 0.42;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2;
        const a1 = ((i + 1) / segs) * Math.PI * 2;
        const p00 = [cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0, z0];
        const p10 = [cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0, z0];
        const p01 = [cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1, z1];
        const p11 = [cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1, z1];
        m.pushQuad(p00, p01, p11, p10, C_NOZZLE);

        // Glowing hot inner core disk
        const g0 = [cx + Math.cos(a0) * rInner, cy + Math.sin(a0) * rInner, z1 - 0.1];
        const g1 = [cx + Math.cos(a1) * rInner, cy + Math.sin(a1) * rInner, z1 - 0.1];
        m.pushTri([cx, cy, z1 - 0.25], g0, g1, C_GLOW, 1.0);
      }
    }

    return m.toArray();
  }

  function createMissileMesh() {
    const m = buildMeshBuilder();
    const C_BODY = '#e6e2d3';
    const C_BAND = '#d93843';
    const C_FIN  = '#4d5669';
    const C_GLOW = '#ffe5a3';
    // Local missile: -Z nose, +Z tail, ~3.4m long
    const tip = [0, 0, -2.1];
    const r = 0.22;
    const ring = (z, rad) => [
      [0, rad, z], [rad, 0, z], [0, -rad, z], [-rad, 0, z]
    ];
    const r1 = ring(-1.25, r);
    const r2 = ring(-0.75, r);
    const r3 = ring(1.35, r);
    for (let i = 0; i < 4; i++) {
      const ni = (i + 1) % 4;
      m.pushTri(tip, r1[ni], r1[i], C_BODY);
      m.pushQuad(r1[i], r1[ni], r2[ni], r2[i], C_BAND);
      m.pushQuad(r2[i], r2[ni], r3[ni], r3[i], C_BODY);
      m.pushTri([0, 0, 1.38], r3[i], r3[ni], C_GLOW, 1.0);
    }
    // Tail fins
    m.pushSymTri([0, 0.1, 0.55], [0.68, 0.0, 1.38], [0, -0.1, 1.38], C_FIN, C_FIN);
    m.pushTri([0.08, 0, 0.55], [0, 0.68, 1.38], [-0.08, 0, 1.38], C_FIN);
    m.pushTri([-0.08, 0, 0.55], [0, -0.68, 1.38], [0.08, 0, 1.38], C_FIN);
    return m.toArray();
  }

  // =========================================================================
  // 8. WEBGL2 RENDERER SETUP
  // =========================================================================
  const glCanvas = document.getElementById('glCanvas');
  const hudCanvas = document.getElementById('hudCanvas');
  const hudCtx = hudCanvas.getContext('2d', { alpha: true });

  const gl = glCanvas.getContext('webgl2', {
    antialias: false,
    alpha: false,
    depth: false,
    stencil: false,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: true
  });
  if (!gl) {
    document.getElementById('loadStatus').textContent = 'WEBGL2 REQUIRED';
    throw new Error('WebGL2 not supported');
  }

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      console.error(log, src);
      throw new Error('Shader compile failed: ' + log);
    }
    return sh;
  }
  function createProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(p);
      console.error(log);
      throw new Error('Program link failed: ' + log);
    }
    return p;
  }

  const progWorld = createProgram(VS_QUAD, FS_WORLD);
  const progMesh  = createProgram(VS_MESH, FS_MESH);
  const progFx    = createProgram(VS_FX, FS_FX);
  const progPost  = createProgram(VS_QUAD, FS_POST);

  // Uniform locations
  const uWorld = {
    uTerrainA: gl.getUniformLocation(progWorld, 'uTerrainA'),
    uTerrainB: gl.getUniformLocation(progWorld, 'uTerrainB'),
    uInvViewProj: gl.getUniformLocation(progWorld, 'uInvViewProj'),
    uViewProj: gl.getUniformLocation(progWorld, 'uViewProj'),
    uCamPos: gl.getUniformLocation(progWorld, 'uCamPos'),
    uSunDir: gl.getUniformLocation(progWorld, 'uSunDir'),
    uTime: gl.getUniformLocation(progWorld, 'uTime'),
    uPlanePos: gl.getUniformLocation(progWorld, 'uPlanePos'),
    uPlaneFwd: gl.getUniformLocation(progWorld, 'uPlaneFwd'),
    uPlaneRight: gl.getUniformLocation(progWorld, 'uPlaneRight'),
    uImpacts: gl.getUniformLocation(progWorld, 'uImpacts'),
    uImpactMeta: gl.getUniformLocation(progWorld, 'uImpactMeta'),
  };
  const uMesh = {
    uViewProj: gl.getUniformLocation(progMesh, 'uViewProj'),
    uModel: gl.getUniformLocation(progMesh, 'uModel'),
    uSunDir: gl.getUniformLocation(progMesh, 'uSunDir'),
    uBurnerGlow: gl.getUniformLocation(progMesh, 'uBurnerGlow'),
    uMaskId: gl.getUniformLocation(progMesh, 'uMaskId'),
  };
  const uFx = {
    uViewProj: gl.getUniformLocation(progFx, 'uViewProj'),
  };
  const uPost = {
    uColorTex: gl.getUniformLocation(progPost, 'uColorTex'),
    uMaskTex: gl.getUniformLocation(progPost, 'uMaskTex'),
    uTexel: gl.getUniformLocation(progPost, 'uTexel'),
    uPalette: gl.getUniformLocation(progPost, 'uPalette'),
    uFlash: gl.getUniformLocation(progPost, 'uFlash'),
  };

  // Empty VAO for fullscreen quads
  const emptyVao = gl.createVertexArray();

  // Upload Fighter & Missile VAOs
  function uploadMeshVao(data) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const stride = 10 * 4;
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 3 * 4);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 6 * 4);
    gl.enableVertexAttribArray(3);
    gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 9 * 4);
    gl.bindVertexArray(null);
    return { vao, count: data.length / 10 };
  }
  const fighterMesh = uploadMeshVao(createFighterMesh());
  const missileMesh = uploadMeshVao(createMissileMesh());

  // Dynamic 3D FX Buffer (Pos3 + Color4)
  const MAX_FX_VERTS = 36000;
  const fxData = new Float32Array(MAX_FX_VERTS * 7);
  let fxVertCount = 0;
  const fxVao = gl.createVertexArray();
  const fxBuf = gl.createBuffer();
  gl.bindVertexArray(fxVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, fxBuf);
  gl.bufferData(gl.ARRAY_BUFFER, fxData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 7 * 4, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 7 * 4, 3 * 4);
  gl.bindVertexArray(null);

  function fxTri(a, b, c, r, g, bl, al) {
    if (fxVertCount + 3 > MAX_FX_VERTS) return;
    let o = fxVertCount * 7;
    fxData[o++] = a[0]; fxData[o++] = a[1]; fxData[o++] = a[2]; fxData[o++] = r; fxData[o++] = g; fxData[o++] = bl; fxData[o++] = al;
    fxData[o++] = b[0]; fxData[o++] = b[1]; fxData[o++] = b[2]; fxData[o++] = r; fxData[o++] = g; fxData[o++] = bl; fxData[o++] = al;
    fxData[o++] = c[0]; fxData[o++] = c[1]; fxData[o++] = c[2]; fxData[o++] = r; fxData[o++] = g; fxData[o++] = bl; fxData[o++] = al;
    fxVertCount += 3;
  }
  function fxQuad(a, b, c, d, r, g, bl, al) {
    fxTri(a, b, c, r, g, bl, al);
    fxTri(a, c, d, r, g, bl, al);
  }
  function fxBillboard(center, size, camRight, camUp, r, g, bl, al) {
    // Crisp 8-sided circular puff billboard (never boxy squares!)
    const segs = 8;
    const rx = camRight[0] * size, ry = camRight[1] * size, rz = camRight[2] * size;
    const ux = camUp[0] * size,    uy = camUp[1] * size,    uz = camUp[2] * size;
    let prev = [center[0] + rx, center[1] + ry, center[2] + rz];
    for (let i = 1; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const cur = [
        center[0] + rx * ca + ux * sa,
        center[1] + ry * ca + uy * sa,
        center[2] + rz * ca + uz * sa
      ];
      fxTri(center, prev, cur, r, g, bl, al);
      prev = cur;
    }
  }

  // Offscreen FBO (Color + Aircraft Mask + Depth24) with Dynamic Resolution Scaling
  const RES_TIERS = [340, 296, 256, 216];
  let resTier = 0;
  let internalW = 604;
  let internalH = 340;
  let fbo = null;
  let fboColorTex = null;
  let fboMaskTex = null;
  let fboDepthRb = null;

  function allocateRenderTargets(targetH) {
    const aspect = Math.max(0.5, window.innerWidth / Math.max(1, window.innerHeight));
    internalH = Math.max(180, Math.round(targetH));
    internalW = Math.max(240, Math.round(internalH * aspect));

    glCanvas.width = internalW;
    glCanvas.height = internalH;
    hudCanvas.width = internalW;
    hudCanvas.height = internalH;
    hudCtx.imageSmoothingEnabled = false;

    if (fbo) {
      gl.deleteFramebuffer(fbo);
      gl.deleteTexture(fboColorTex);
      gl.deleteTexture(fboMaskTex);
      gl.deleteRenderbuffer(fboDepthRb);
    }

    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

    fboColorTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fboColorTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, internalW, internalH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboColorTex, 0);

    fboMaskTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fboMaskTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, internalW, internalH, 0, gl.RED, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, fboMaskTex, 0);

    fboDepthRb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, fboDepthRb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, internalW, internalH);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fboDepthRb);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  let terrainTexA = null;
  let terrainTexB = null;
  function uploadTerrainTextures(data) {
    const N = TERRAIN_RES * TERRAIN_RES;
    const rgbaA = new Float32Array(N * 4);
    const rgbaB = new Uint8Array(N * 4);
    for (let i = 0; i < N; i++) {
      rgbaA[i * 4 + 0] = data.heights[i];
      rgbaA[i * 4 + 1] = data.shadows[i];
      rgbaA[i * 4 + 2] = data.biomes[i];
      rgbaA[i * 4 + 3] = data.conifers[i];

      rgbaB[i * 4 + 0] = clamp(Math.round((data.normX[i] * 0.5 + 0.5) * 255), 0, 255);
      rgbaB[i * 4 + 1] = clamp(Math.round((data.normZ[i] * 0.5 + 0.5) * 255), 0, 255);
      rgbaB[i * 4 + 2] = 0;
      rgbaB[i * 4 + 3] = 255;
    }

    terrainTexA = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, terrainTexA);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, TERRAIN_RES, TERRAIN_RES, 0, gl.RGBA, gl.FLOAT, rgbaA);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

    terrainTexB = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, terrainTexB);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, TERRAIN_RES, TERRAIN_RES, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgbaB);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  }

  // 4 Underwing Pylons (Local coordinates on jet)
  const PYLON_OFFSETS = [

  const activeMissiles = [];

  function computePlaneBasis() {
    const cy = Math.cos(plane.yaw), sy = Math.sin(plane.yaw);
    const cp = Math.cos(plane.pitch), sp = Math.sin(plane.pitch);
    // Forward vector (yaw=0 -> -Z North, yaw=+PI/2 -> +X East)
    const fwd = [sy * cp, sp, -cy * cp];
    const worldUp = [0, 1, 0];
    const baseRight = v3Norm(v3Cross(fwd, worldUp));
    const baseUp = v3Cross(baseRight, fwd);

    // Apply total roll (bank + barrel roll)
    const cr = Math.cos(plane.visualRoll);
    const sr = Math.sin(plane.visualRoll);
    // Positive roll = right wing down -> right moves toward -baseUp
    const right = [
      baseRight[0] * cr - baseUp[0] * sr,
      baseRight[1] * cr - baseUp[1] * sr,
      baseRight[2] * cr - baseUp[2] * sr
    ];
    const up = [
      baseUp[0] * cr + baseRight[0] * sr,
      baseUp[1] * cr + baseRight[1] * sr,
      baseUp[2] * cr + baseRight[2] * sr
    ];
    plane.fwd = fwd;
    plane.right = right;
    plane.up = up;
    const back = [-fwd[0], -fwd[1], -fwd[2]];
    plane.modelMat = mat4FromBasisPos(right, up, back, plane.pos, 1.0);
  }

  function localToWorld(off) {
    const back = [-plane.fwd[0], -plane.fwd[1], -plane.fwd[2]];
    return [
      plane.pos[0] + plane.right[0] * off[0] + plane.up[0] * off[1] + back[0] * off[2],
      plane.pos[1] + plane.right[1] * off[0] + plane.up[1] * off[1] + back[1] * off[2],
      plane.pos[2] + plane.right[2] * off[0] + plane.up[2] * off[1] + back[2] * off[2],
    ];
  }

  function triggerBarrelRoll() {
    if (plane.rollTimer > 0.08) return;
    plane.rollTimer = plane.rollDuration;
    plane.rollDir = (plane.bank >= 0) ? 1 : -1;
    sfx.playRoll();
  }

  function fireMissile() {
    // Pick next ready pylon alternating wings
    let chosen = -1;
    for (let k = 0; k < 4; k++) {
      const idx = (nextPylonIdx + k) % 4;
      if (pylons[idx].reload <= 0) {
        chosen = idx;
        nextPylonIdx = (idx + 1) % 4;
        break;
      }
    }
    if (chosen < 0) {
      sfx.playBeep(310, 0.05, 0.05);
      return false;
    }
    pylons[chosen].reload = MISSILE_RELOAD_TIME;
    const startPos = localToWorld(pylons[chosen].offset);

    // Determine target: where nose points, OR ground ahead when flying roughly level
    let aimDir = [...plane.fwd];
    let targetPos = null;
    let noseHitDist = -1;
    if (plane.fwd[1] < -0.06) {
      // Raycast along nose direction to terrain/water
      for (let d = 30; d < 1600; d += 12) {
        const px = startPos[0] + aimDir[0] * d;
        const py = startPos[1] + aimDir[1] * d;
        const pz = startPos[2] + aimDir[2] * d;
        if (py <= sampleSurfaceY(px, pz) + 0.5) {
          noseHitDist = d;
          targetPos = [px, sampleSurfaceY(px, pz), pz];
          break;
        }
      }
    }

    // If level flight (or slight pitch up < 14 deg) and nose didn't hit nearby ground, guide toward ground ahead!
    if (!targetPos && plane.pitch > -0.20 && plane.pitch < 0.24) {
      const horizFwd = v3Norm([plane.fwd[0], 0, plane.fwd[2]]);
      const lookDist = clamp(320 + plane.pos[1] * 1.45, 360, 740);
      const tx = plane.pos[0] + horizFwd[0] * lookDist;
      const tz = plane.pos[2] + horizFwd[2] * lookDist;
      const ty = sampleSurfaceY(tx, tz);
      targetPos = [tx, ty, tz];
    }

    const initSpeed = plane.speed + 45;
    activeMissiles.push({
      pos: startPos,
      vel: [
        plane.fwd[0] * initSpeed - plane.up[0] * 10,
        plane.fwd[1] * initSpeed - plane.up[1] * 10,
        plane.fwd[2] * initSpeed - plane.up[2] * 10
      ],
      dir: [...plane.fwd],
      target: targetPos,
      age: 0,
      maxAge: 6.5,
      smokeAcc: 0
    });

    cam.shake = Math.max(cam.shake, 0.22);
    sfx.playMissileLaunch();
    return true;
  }

  function spawnImpact(pos, isWater) {
    // Record persistent ground scorch / water foam ring in shader buffer
    const slot = impacts[impactCursor];
    impactCursor = (impactCursor + 1) % MAX_IMPACTS;
    slot.pos = [pos[0], pos[1], pos[2]];
    slot.age = 0.001;
    slot.isWater = isWater ? 1.0 : 0.0;
    slot.radius = isWater ? 26 : 22;
    slot.flash = 1.0;

    // Proximity flash & shake
    const dCam = Math.hypot(pos[0] - cam.eye[0], pos[1] - cam.eye[1], pos[2] - cam.eye[2]);
    const prox = clamp(1.0 - dCam / 1100, 0.15, 1.0);
    screenFlash = Math.max(screenFlash, prox * 0.72);
    cam.shake = Math.max(cam.shake, prox * 0.85);
    sfx.playExplosion(isWater, prox);

    // Expanding shockwave ring
    shockRings.push({
      pos: [pos[0], pos[1] + 1.4, pos[2]],

      maxAge: isWater ? 0.95 : 0.85,
      maxRadius: isWater ? 64 : 74,

    });

    // Initial intense flash puff

        particles.push({

      for (let i = 0; i < 10; i++) {

  function cycleCamera() {
    cam.prevMode = cam.mode;
    cam.mode = (cam.mode + 1) % 3;
    cam.trans = 0.0;
    document.getElementById('viewBtn').textContent = CAMERA_MODES[cam.mode];
