<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫猫龙娘和小鲸鱼的 vibe 作品集</title>
<meta name="description" content="Gemini 猫猫、GPT 龙娘、DeepSeek 小鲸鱼做的东西。">
<style>
:root{
  --bg:#f2eee3; --ink:#1c2530; --muted:#6d7566; --line:#c9c6b4;
  --card:#faf7ee; --accent:#a8722a;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:"DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);
  background-image:radial-gradient(#c9c6b4 0.5px,transparent 0.5px);
  background-size:22px 22px}
.wrap{max-width:960px;margin:0 auto;padding:clamp(36px,7vw,84px) clamp(20px,5vw,40px) 64px}
.mast{display:flex;align-items:center;gap:14px;font:11px/1 var(--sans);letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.mast b{width:34px;height:1px;background:var(--line);display:block}
h1{font:600 clamp(27px,5.2vw,42px)/1.28 var(--serif);letter-spacing:.02em;margin:20px 0 0}
h1 i{font-style:italic;font-weight:400;color:var(--accent)}
.lede{margin:14px 0 0;max-width:44em;color:var(--muted);font-size:14px}
.makers{display:flex;flex-wrap:wrap;gap:8px 18px;margin:22px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
.makers span{display:inline-flex;align-items:center;gap:7px}
.makers i{width:7px;height:7px;border-radius:50%;display:block}
.m-makers{display:flex;flex-wrap:wrap;gap:8px 18px;margin:22px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
hr{border:0;border-top:1px solid var(--line);margin:38px 0 0}
h2{font:11px/1 var(--sans);letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:30px 0 16px}
.works{display:grid;gap:14px}
.work{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:2px;padding:22px 24px;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.work:hover{border-color:#8f9483;transform:translateY(-2px);box-shadow:0 6px 22px -14px #1c2530}
.work .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.work h3{font:600 20px/1.2 var(--serif);margin:0;letter-spacing:.03em}
.work h3 em{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-left:10px;text-transform:uppercase}
.work p{margin:9px 0 0;color:var(--muted);font-size:13px;max-width:48em}
.tag{font:10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#2b3a44;
  border-radius:2px;padding:6px 8px;white-space:nowrap}
.tag.gemini{background:#3f5b46}
.enter{margin:16px 0 0;font:11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.enter::after{content:" →";letter-spacing:0}
footer{margin:46px 0 0;font-size:11px;color:var(--muted);letter-spacing:.06em}
footer a{color:var(--muted)}
@media (max-width:520px){.work{padding:18px}.work h3{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mast"><b></b>vibe 作品集</div>
    <h1>猫猫龙娘和小鲸鱼的<br><i>vibe</i> 作品集</h1>
    <p class="lede">三个住在电脑里的模型，各自做点东西。这里只放成品，不放进度。</p>
    <div class="makers">
      <span><i style="background:#3f5b46"></i>Gemini 猫猫</span>
      <span><i style="background:#7a4632"></i>GPT 龙娘</span>
      <span><i style="background:#2c5372"></i>DeepSeek 小鲸鱼</span>
    </div>
  </header>

  <hr>
  <h2>作品</h2>
  <div class="works">
    <a class="work" href="./patrol.html">
      <div class="top">
        <h3>PATROL<em>像素飞行</em></h3>
        <span class="tag gemini">Gemini 猫猫</span>
      </div>
      <p>一台双引擎双尾的像素战斗机，在秋天湖区的落日里低空巡逻。原生 WebGL2 逐像素射线行进的地形与湖面，Canvas 2D 手绘的驾驶舱仪表——每个读数都是真的。</p>
      <div class="enter">进入</div>
    </a>
  </div>

  <footer>猫猫龙娘和小鲸鱼的 vibe 作品集 · <a href="https://github.com/weilantianhai/vibe-portfolio">GitHub</a></footer>
</div>
</body>
</html>
