  // Compute ideal camera pose for a given mode (0: Top-Down, 1: Chase, 2: Cockpit)
  function getCameraPose(mode, simTime) {
    if (mode === 0) {
      // Top-Down (North-Up): strictly North (-Z) is up on screen, slight 3D tilt so terrain/clouds pop
      const leadX = plane.fwd[0] * 26;
      const leadZ = plane.fwd[2] * 26;
      const target = [plane.pos[0] + leadX, plane.pos[1] - 12, plane.pos[2] + leadZ];
      const camH = 265 + plane.burner * 28;
      const eye = [target[0], plane.pos[1] + camH, target[2] + 58];
      return { eye, target, up: [0, 1, 0], fov: 0.88 };
    } else if (mode === 1) {
      // Chase Camera trailing smoothly behind & slightly above jet
      const ccy = Math.cos(cam.chaseYaw), csy = Math.sin(cam.chaseYaw);
      const ccp = Math.cos(cam.chasePitch), csp = Math.sin(cam.chasePitch);
      const chaseFwd = [csy * ccp, csp, -ccy * ccp];
      const dist = 30.0 + plane.burner * 4.5;
      const lift = 8.8;
      const eye = [
        plane.pos[0] - chaseFwd[0] * dist,
        plane.pos[1] - chaseFwd[1] * dist + lift,
        plane.pos[2] - chaseFwd[2] * dist
      ];
      // Prevent chase camera from dipping below terrain/water
      const groundAtCam = sampleSurfaceY(eye[0], eye[2]) + 5.5;
      if (eye[1] < groundAtCam) eye[1] = groundAtCam;
      const target = [
        plane.pos[0] + plane.fwd[0] * 55,
        plane.pos[1] + plane.fwd[1] * 55 + 2.5,
        plane.pos[2] + plane.fwd[2] * 55
      ];
      // Subtle horizon tilt following jet bank
      const bankTilt = plane.bank * 0.22;
      const rVec = v3Norm(v3Cross(chaseFwd, [0, 1, 0]));
      const up = v3Norm([
        -rVec[0] * Math.sin(bankTilt),
        Math.cos(bankTilt),
        -rVec[2] * Math.sin(bankTilt)
      ]);
      return { eye, target, up, fov: 1.02 + plane.burner * 0.08 };
    } else {
      // Cockpit View (seated in canopy looking ahead, aligned precisely with aircraft attitude)
      const eye = localToWorld([0, 1.42, -3.15]);
      const target = [
        eye[0] + plane.fwd[0] * 120,
        eye[1] + plane.fwd[1] * 120,
        eye[2] + plane.fwd[2] * 120
      ];
      return { eye, target, up: [...plane.up], fov: 1.08 + plane.burner * 0.05 };
    }
  }

  // =========================================================================
  // 10. SIMULATION UPDATE
  // =========================================================================
  let simTime = 0;

  function stepSimulation(dt) {
    simTime += dt;

    // Determine afterburner hold state (LMB held > 0.16s OR touchBurn)
    if (input.lmbDown) input.lmbHoldTime += dt;
    const lmbHeld = input.lmbDown && (input.lmbHoldTime > 0.16);
    const burnerActive = lmbHeld || input.touchBurn;
    plane.burner = lerp(plane.burner, burnerActive ? 1.0 : 0.0, 1 - Math.exp(-dt * 6.5));
    plane.throttle = lerp(plane.throttle, burnerActive ? 1.0 : 0.62, 1 - Math.exp(-dt * 4.5));

    // Desired turn & pitch control
    let desiredTurn = 0;
    let desiredPitch = 0;

    if (!input.playerActive) {
      // Lazy scenic S-turns before first mouse/touch movement!
      desiredTurn = Math.sin(simTime * 0.34) * 0.44 + Math.sin(simTime * 0.15) * 0.18;
      const altErr = (CRUISE_ALT_Y + Math.sin(simTime * 0.42) * 14) - plane.pos[1];
      desiredPitch = clamp(altErr * 0.006, -0.22, 0.26);
    } else if (cam.mode === 0) {
      // TOP-DOWN: aircraft flies toward the mouse cursor (or touch stick direction)
      let dirX = 0, dirZ = 0;
      if (input.touchActive && Math.hypot(input.touchStickX, input.touchStickY) > 0.12) {
        dirX = input.touchStickX;
        dirZ = input.touchStickY;
      } else {
        // Project plane position to normalized screen space so cursor-relative steering is exact!
        const sp = projectPoint(cam.vpMat, plane.pos, 1, 1);
        const px = sp ? sp.x : 0.5;
        const py = sp ? sp.y : 0.5;
        dirX = input.mouseX - px;
        dirZ = input.mouseY - py;
      }
      const mag = Math.hypot(dirX, dirZ);
      if (mag > 0.025) {
        // Screen +X = East (+X), Screen +Y = South (+Z) because North (-Z) is UP
        const targetYaw = Math.atan2(dirX, -dirZ);
        const err = wrapAngle(targetYaw - plane.yaw);
        desiredTurn = clamp(err * 1.45, -1.0, 1.0);
      }
      // Maintain scenic cruising height above clouds in Top-Down
      const groundHere = sampleSurfaceY(plane.pos[0], plane.pos[2]);
      const targetAlt = Math.max(CRUISE_ALT_Y, groundHere + 55);
      desiredPitch = clamp((targetAlt - plane.pos[1]) * 0.009, -0.35, 0.42);
    } else {
      // CHASE & COCKPIT: cursor offset from screen center sets turn and climb/dive
      let ox, oy;
      if (input.touchActive) {
        ox = input.touchStickX;
        oy = input.touchStickY;
      } else {
        ox = clamp((input.mouseX - 0.5) * 2.15, -1.0, 1.0);
        oy = clamp((input.mouseY - 0.5) * 2.15, -1.0, 1.0);
      }
      // Deadzone for smooth straight flight
      const dz = (v) => {
        const a = Math.abs(v);
        if (a < 0.05) return 0;
        return Math.sign(v) * ((a - 0.05) / 0.95);
      };
      desiredTurn = dz(ox);
      // Mouse UP (oy < 0) = climb (+pitch); Mouse DOWN (oy > 0) = dive (-pitch)
      desiredPitch = clamp(-dz(oy) * 0.72, -0.68, 0.68);
    }

    // Automatic Terrain Avoidance (Arcade Flight — never crashes!)
    let maxAheadGround = sampleSurfaceY(plane.pos[0], plane.pos[2]);
    const hFwd = v3Norm([plane.fwd[0], 0, plane.fwd[2]]);
    for (const d of [45, 105, 175, 255]) {
      const gx = plane.pos[0] + hFwd[0] * d;
      const gz = plane.pos[2] + hFwd[2] * d;
      const gy = sampleSurfaceY(gx, gz);
      // Account for predicted drop if descending
      const predictedY = plane.pos[1] + Math.min(0, plane.fwd[1]) * d;
      if (gy + 16 > predictedY) {
        maxAheadGround = Math.max(maxAheadGround, gy);
      }
    }
    const groundUnder = sampleSurfaceY(plane.pos[0], plane.pos[2]);
    const isOverWater = sampleTerrainMeters(plane.pos[0], plane.pos[2]) <= 0.1;
    const minSafeAlt = isOverWater ? (WATER_Y + 7.5) : (groundUnder + 19.0);
    const lookaheadSafeAlt = maxAheadGround + (maxAheadGround <= 0.5 ? 9.5 : 24.0);

    plane.radAlt = Math.max(0, plane.pos[1] - groundUnder);
    plane.lowAlt = plane.radAlt < 38.0;
    plane.pullUp = false;

    if (plane.pos[1] < lookaheadSafeAlt + 18.0 && (plane.pitch < 0.18 || plane.pos[1] < lookaheadSafeAlt)) {
      const urgency = clamp((lookaheadSafeAlt + 18.0 - plane.pos[1]) / 36.0, 0, 1);
      const safePitch = 0.12 + urgency * 0.52;
      if (desiredPitch < safePitch) {
        desiredPitch = lerp(desiredPitch, safePitch, Math.min(1.0, urgency * 1.35));
      }
      if (urgency > 0.32 && (plane.pitch < -0.05 || plane.pos[1] < minSafeAlt + 12)) {
        plane.pullUp = true;
      }
    }

    // Ceiling clamp so jet stays in scenic atmosphere
    if (plane.pos[1] > 420 && desiredPitch > 0) {
      desiredPitch = lerp(desiredPitch, -0.08, clamp((plane.pos[1] - 420) / 80, 0, 1));
    }

    // Smooth angular dynamics
    const targetBank = clamp(desiredTurn * 1.08, -1.12, 1.12);
    const prevBank = plane.bank;
    plane.bank = lerp(plane.bank, targetBank, 1 - Math.exp(-dt * 5.2));

    const yawSpeed = plane.bank * (1.28 + plane.burner * 0.24);
    plane.turnRate = yawSpeed;
    plane.yaw = wrapAngle(plane.yaw + yawSpeed * dt);

    const prevPitch = plane.pitch;
    plane.pitch = lerp(plane.pitch, desiredPitch, 1 - Math.exp(-dt * 4.4));
    plane.pitch = clamp(plane.pitch, -0.82, 0.82);

    // Barrel Roll state machine
    let rollBonus = 0;
    if (plane.rollTimer > 0) {
      plane.rollTimer = Math.max(0, plane.rollTimer - dt);
      const t = 1.0 - plane.rollTimer / plane.rollDuration;
      // Smooth ease-in-out full 360 degree barrel roll
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      rollBonus = eased * Math.PI * 2 * plane.rollDir;
    }
    plane.visualRoll = plane.bank + rollBonus;

    // Airspeed (affected by afterburner & climb/dive gravity energy)
    const targetSpeed = 142.0 + plane.burner * 98.0 - Math.sin(plane.pitch) * 32.0;
    plane.speed = lerp(plane.speed, clamp(targetSpeed, 108, 265), 1 - Math.exp(-dt * 2.4));

    computePlaneBasis();

    // Advance position
    const prevY = plane.pos[1];
    plane.pos[0] += plane.fwd[0] * plane.speed * dt;
    plane.pos[1] += plane.fwd[1] * plane.speed * dt;
    plane.pos[2] += plane.fwd[2] * plane.speed * dt;

    // Hard safety floor (guaranteed no crash!)
    const newGround = sampleSurfaceY(plane.pos[0], plane.pos[2]);
    const hardFloor = (sampleTerrainMeters(plane.pos[0], plane.pos[2]) <= 0.1) ? (WATER_Y + 6.5) : (newGround + 14.0);
    if (plane.pos[1] < hardFloor) {
      plane.pos[1] = hardFloor;
      if (plane.pitch < 0.1) plane.pitch = lerp(plane.pitch, 0.2, 0.35);
      plane.pullUp = true;
      computePlaneBasis();
    }

    // Wrap coordinates cleanly modulo huge multiple of TILE_SIZE so float precision stays razor sharp even after hours!
    const WRAP_SPAN = TILE_SIZE * 16;
    if (Math.abs(plane.pos[0]) > WRAP_SPAN) {
      const shift = Math.sign(plane.pos[0]) * WRAP_SPAN;
      plane.pos[0] -= shift;
      for (const m of activeMissiles) { m.pos[0] -= shift; if (m.target) m.target[0] -= shift; }
      for (const p of particles) p.pos[0] -= shift;
      for (const r of shockRings) r.pos[0] -= shift;
      for (const v of vaporLeft) v.pos[0] -= shift;
      for (const v of vaporRight) v.pos[0] -= shift;
      for (const imp of impacts) imp.pos[0] -= shift;
      cam.eye[0] -= shift;
      cam.target[0] -= shift;
    }
    if (Math.abs(plane.pos[2]) > WRAP_SPAN) {
      const shift = Math.sign(plane.pos[2]) * WRAP_SPAN;
      plane.pos[2] -= shift;
      for (const m of activeMissiles) { m.pos[2] -= shift; if (m.target) m.target[2] -= shift; }
      for (const p of particles) p.pos[2] -= shift;
      for (const r of shockRings) r.pos[2] -= shift;
      for (const v of vaporLeft) v.pos[2] -= shift;
      for (const v of vaporRight) v.pos[2] -= shift;
      for (const imp of impacts) imp.pos[2] -= shift;
      cam.eye[2] -= shift;
      cam.target[2] -= shift;
    }

    // Flight telemetry for Cockpit & HUD
    plane.vSpeed = (plane.pos[1] - prevY) / Math.max(dt, 0.001);
    const pitchRate = (plane.pitch - prevPitch) / Math.max(dt, 0.001);
    const centrip = Math.abs(plane.turnRate) * (plane.speed / 58.0);
    const rawG = Math.cos(plane.pitch) + centrip + pitchRate * 2.4 + (plane.rollTimer > 0 ? 1.6 : 0);
    plane.gLoad = lerp(plane.gLoad, clamp(rawG, 0.2, 7.8), 1 - Math.exp(-dt * 8.0));
    const bankRate = (plane.bank - prevBank) / Math.max(dt, 0.001);
    plane.slip = lerp(plane.slip, clamp(bankRate * 0.45 + (plane.rollTimer > 0 ? plane.rollDir * 0.5 : 0), -1, 1), 1 - Math.exp(-dt * 9.0));

    // Wingtip vapor trails
    const tipL = localToWorld([-7.8, -0.06, 3.8]);
    const tipR = localToWorld([ 7.8, -0.06, 3.8]);
    const vaporStrength = clamp(0.32 + Math.abs(plane.bank) * 0.48 + (plane.rollTimer > 0 ? 0.55 : 0) + plane.burner * 0.28, 0.28, 1.0);
    vaporLeft.push({ pos: tipL, age: 0, strength: vaporStrength });
    vaporRight.push({ pos: tipR, age: 0, strength: vaporStrength });
    const maxVaporAge = 1.45;
    for (const arr of [vaporLeft, vaporRight]) {
      for (let i = arr.length - 1; i >= 0; i--) {
        arr[i].age += dt;
        if (arr[i].age > maxVaporAge) arr.splice(i, 1);
      }
      while (arr.length > 56) arr.shift();
    }

    // Low-altitude water skim spray plumes
    if (isOverWater && plane.pos[1] < 27.0) {
      const skimAmt = 1.0 - plane.pos[1] / 27.0;
      if (Math.random() < clamp(skimAmt * 1.4, 0.25, 0.95)) {
        for (const side of [-1, 1]) {
          const sp = localToWorld([side * (2.6 + Math.random() * 2.5), -plane.pos[1] + 0.8, 5.5 + Math.random() * 3]);
          sp[1] = WATER_Y + 0.6;
          particles.push({
            pos: sp,
            vel: [
              -plane.fwd[0] * 18 + plane.right[0] * side * (12 + Math.random() * 14),
              6 + skimAmt * (12 + Math.random() * 12),
              -plane.fwd[2] * 18 + plane.right[2] * side * (12 + Math.random() * 14)
            ],
            age: 0,
            maxAge: 0.45 + Math.random() * 0.35,
            size0: 2.0 + skimAmt * 2.5,
            size1: 5.5 + skimAmt * 4.5,
            kind: 'spray'
          });
        }
      }
    }

    // Reload missile pylons
    for (let i = 0; i < 4; i++) {
      if (pylons[i].reload > 0) {
        pylons[i].reload = Math.max(0, pylons[i].reload - dt);
        if (pylons[i].reload === 0) sfx.playBeep(980, 0.035, 0.04);
      }
    }

    // Update active missiles
    for (let i = activeMissiles.length - 1; i >= 0; i--) {
      const ms = activeMissiles[i];
      ms.age += dt;
      // After 0.08s rail drop, rocket accelerates & steers cleanly toward target
      const spd = Math.min(430, 175 + ms.age * 460);
      if (ms.age > 0.08 && ms.target) {
        const toT = [ms.target[0] - ms.pos[0], ms.target[1] - ms.pos[1], ms.target[2] - ms.pos[2]];
        const dist = Math.hypot(toT[0], toT[1], toT[2]);
        if (dist > 1) {
          const desired = [toT[0] / dist, toT[1] / dist, toT[2] / dist];
          const turn = 1 - Math.exp(-dt * 6.5);
          ms.dir = v3Norm([
            lerp(ms.dir[0], desired[0], turn),
            lerp(ms.dir[1], desired[1], turn),
            lerp(ms.dir[2], desired[2], turn)
          ]);
        }
      }
      ms.vel = [ms.dir[0] * spd, ms.dir[1] * spd, ms.dir[2] * spd];
      const prevPos = [...ms.pos];
      ms.pos[0] += ms.vel[0] * dt;
      ms.pos[1] += ms.vel[1] * dt;
      ms.pos[2] += ms.vel[2] * dt;

      // Dense sleek missile smoke trail puffs
      ms.smokeAcc += dt;
      while (ms.smokeAcc >= 0.011) {
        ms.smokeAcc -= 0.011;
        particles.push({
          pos: [ms.pos[0] - ms.dir[0] * 2.5, ms.pos[1] - ms.dir[1] * 2.5, ms.pos[2] - ms.dir[2] * 2.5],
          vel: [(Math.random() - 0.5) * 2.5, 1.8 + Math.random() * 1.5, (Math.random() - 0.5) * 2.5],
          age: 0, maxAge: 1.15 + Math.random() * 0.35,
          size0: 1.0, size1: 3.3,
          kind: 'mslSmoke'
        });
      }

      // Terrain / Water impact check (substep along fast missile segment)
      let hit = false;
      let hitPos = null;
      let hitWater = false;
      for (let s = 1; s <= 4; s++) {
        const f = s / 4;
        const sx = lerp(prevPos[0], ms.pos[0], f);
        const sy = lerp(prevPos[1], ms.pos[1], f);
        const sz = lerp(prevPos[2], ms.pos[2], f);
        const terrY = sampleTerrainMeters(sx, sz);
        const surfY = Math.max(WATER_Y, terrY);
        if (sy <= surfY + 0.6) {
          hit = true;
          hitWater = terrY <= 0.08;
          hitPos = [sx, surfY, sz];
          break;
        }
      }
      if (hit) {
        spawnImpact(hitPos, hitWater);
        activeMissiles.splice(i, 1);
      } else if (ms.age > ms.maxAge) {
        activeMissiles.splice(i, 1);
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.maxAge) {
        particles.splice(i, 1);
        continue;
      }
      if (p.age < 0) continue;
      if (p.kind === 'spray' || p.kind === 'ember') {
        p.vel[1] -= (p.kind === 'spray' ? 42 : 30) * dt;
      } else if (p.kind === 'smoke' || p.kind === 'fire') {
        p.vel[0] *= (1 - dt * 0.7);
        p.vel[2] *= (1 - dt * 0.7);
      }
      p.pos[0] += p.vel[0] * dt;
      p.pos[1] += p.vel[1] * dt;
      p.pos[2] += p.vel[2] * dt;
    }
    while (particles.length > 650) particles.shift();

    // Update shockwave rings
    for (let i = shockRings.length - 1; i >= 0; i--) {
      shockRings[i].age += dt;
      if (shockRings[i].age >= shockRings[i].maxAge) shockRings.splice(i, 1);
    }

    // Update persistent impacts
    for (const imp of impacts) {
      if (imp.age > 0) {
        imp.age += dt;
        imp.flash = Math.max(0, imp.flash - dt * 5.2);
      }
    }
    screenFlash = Math.max(0, screenFlash - dt * 3.8);

    // Update Camera (smooth ~1.0s interpolation between any two modes!)
    const yawDiff = wrapAngle(plane.yaw - cam.chaseYaw);
    cam.chaseYaw = wrapAngle(cam.chaseYaw + yawDiff * (1 - Math.exp(-dt * 4.8)));
    cam.chasePitch = lerp(cam.chasePitch, plane.pitch * 0.75, 1 - Math.exp(-dt * 4.5));
    cam.shake = Math.max(0, cam.shake - dt * 2.2);

    if (cam.trans < 1.0) {
      cam.trans = Math.min(1.0, cam.trans + dt / cam.transDur);
    }
    const poseTo = getCameraPose(cam.mode, simTime);
    if (cam.trans < 1.0) {
      const poseFrom = getCameraPose(cam.prevMode, simTime);
      // Quintic smootherstep for silky 1-second camera transition
      const t = cam.trans;
      const e = t * t * t * (t * (t * 6 - 15) + 10);
      cam.eye = [
        lerp(poseFrom.eye[0], poseTo.eye[0], e),
        lerp(poseFrom.eye[1], poseTo.eye[1], e),
        lerp(poseFrom.eye[2], poseTo.eye[2], e)
      ];
      cam.target = [
        lerp(poseFrom.target[0], poseTo.target[0], e),
        lerp(poseFrom.target[1], poseTo.target[1], e),
        lerp(poseFrom.target[2], poseTo.target[2], e)
      ];
      cam.up = v3Norm([
        lerp(poseFrom.up[0], poseTo.up[0], e),
        lerp(poseFrom.up[1], poseTo.up[1], e),
        lerp(poseFrom.up[2], poseTo.up[2], e)
      ]);
      cam.fov = lerp(poseFrom.fov, poseTo.fov, e);
    } else {
      cam.eye = poseTo.eye;
      cam.target = poseTo.target;
      cam.up = poseTo.up;
      cam.fov = poseTo.fov;
    }

    // Subtle rumble from afterburner & nearby explosions
    const rumble = cam.shake * 0.9 + plane.burner * (cam.mode === 2 ? 0.14 : 0.25);
    const eyeShaken = [
      cam.eye[0] + (Math.sin(simTime * 53) * 0.5) * rumble,
      cam.eye[1] + (Math.cos(simTime * 61) * 0.5) * rumble,
      cam.eye[2] + (Math.sin(simTime * 47 + 1.3) * 0.5) * rumble
    ];

    const aspect = internalW / Math.max(1, internalH);
    cam.viewMat = mat4LookAt(eyeShaken, cam.target, cam.up);
    cam.projMat = mat4Perspective(cam.fov, aspect, 0.8, 3800.0);
    cam.vpMat = mat4Mul(cam.projMat, cam.viewMat);
    cam.invVpMat = invertMat4(cam.vpMat);

    // Camera right & up vectors for 3D billboards
    cam.right = [cam.viewMat[0], cam.viewMat[4], cam.viewMat[8]];
    cam.camUp = [cam.viewMat[1], cam.viewMat[5], cam.viewMat[9]];

    // Audio update
    sfx.updateFlight(clamp((plane.speed - 110) / 140, 0, 1), plane.burner, cam.mode === 2, plane.pullUp, simTime);
  }

  // Exact 4x4 matrix inverse for world ray reconstruction
  function invertMat4(m) {
    const inv = new Float32Array(16);
    const m00 = m[0], m01 = m[1], m02 = m[2], m03 = m[3];
    const m10 = m[4], m11 = m[5], m12 = m[6], m13 = m[7];
    const m20 = m[8], m21 = m[9], m22 = m[10], m23 = m[11];
    const m30 = m[12], m31 = m[13], m32 = m[14], m33 = m[15];

    const b00 = m00 * m11 - m01 * m10, b01 = m00 * m12 - m02 * m10, b02 = m00 * m13 - m03 * m10;
    const b03 = m01 * m12 - m02 * m11, b04 = m01 * m13 - m03 * m11, b05 = m02 * m13 - m03 * m12;
    const b06 = m20 * m31 - m21 * m30, b07 = m20 * m32 - m22 * m30, b08 = m20 * m33 - m23 * m30;
    const b09 = m21 * m32 - m22 * m31, b10 = m21 * m33 - m23 * m31, b11 = m22 * m33 - m23 * m32;

    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    if (Math.abs(det) < 1e-12) return inv;
    det = 1.0 / det;

    inv[0]  = ( m11 * b11 - m12 * b10 + m13 * b09) * det;
    inv[1]  = (-m01 * b11 + m02 * b10 - m03 * b09) * det;
    inv[2]  = ( m31 * b05 - m32 * b04 + m33 * b03) * det;
    inv[3]  = (-m21 * b05 + m22 * b04 - m23 * b03) * det;
    inv[4]  = (-m10 * b11 + m12 * b08 - m13 * b07) * det;
    inv[5]  = ( m00 * b11 - m02 * b08 + m03 * b07) * det;
    inv[6]  = (-m30 * b05 + m32 * b02 - m33 * b01) * det;
    inv[7]  = ( m20 * b05 - m22 * b02 + m23 * b01) * det;
    inv[8]  = ( m10 * b10 - m11 * b08 + m13 * b06) * det;
    inv[9]  = (-m00 * b10 + m01 * b08 - m03 * b06) * det;
    inv[10] = ( m30 * b04 - m31 * b02 + m33 * b00) * det;
    inv[11] = (-m20 * b04 + m21 * b02 - m23 * b00) * det;
    inv[12] = (-m10 * b09 + m11 * b07 - m12 * b06) * det;
    inv[13] = ( m00 * b09 - m01 * b07 + m02 * b06) * det;
    inv[14] = (-m30 * b03 + m31 * b01 - m32 * b00) * det;
    inv[15] = ( m20 * b03 - m21 * b01 + m22 * b00) * det;
    return inv;
  }

  // =========================================================================
  // 11. BUILD 3D FX GEOMETRY (AFTERBURNER, VAPOR TRAILS, PARTICLES, RINGS)
  // =========================================================================
  function buildFxGeometry() {
    fxVertCount = 0;

    // Hide jet plumes when fully seated inside cockpit
    const showJetFx = !(cam.mode === 2 && cam.trans > 0.72);

    // 1. Dual Afterburner Plumes with Bright White Inner Core
    if (showJetFx) {
      const flicker = 0.88 + 0.14 * Math.sin(simTime * 67) + 0.08 * Math.cos(simTime * 113);
      const outerLen = (2.1 + plane.burner * 7.8) * flicker;
      const outerRad = 0.46 + plane.burner * 0.24;
      const coreLen  = (1.1 + plane.burner * 4.6) * flicker;
      const coreRad  = 0.23 + plane.burner * 0.14;

      for (const side of [-1, 1]) {
        const cx = side * 1.12;
        const baseZ = 7.62;
        // Outer fiery orange plume (4-sided cone)
        const tipO = localToWorld([cx, 0, baseZ + outerLen]);
        const ringO = [
          localToWorld([cx, outerRad, baseZ]),
          localToWorld([cx + outerRad, 0, baseZ]),
          localToWorld([cx, -outerRad, baseZ]),
          localToWorld([cx - outerRad, 0, baseZ]),
        ];
        const or = 0.96, og = 0.42 + plane.burner * 0.18, ob = 0.16;
        for (let i = 0; i < 4; i++) {
          const ni = (i + 1) % 4;
          fxTri(ringO[i], ringO[ni], tipO, or, og, ob, 0.88);
        }
        // Bright white-hot inner core
        const tipC = localToWorld([cx, 0, baseZ + coreLen]);
        const ringC = [
          localToWorld([cx, coreRad, baseZ]),
          localToWorld([cx + coreRad, 0, baseZ]),
          localToWorld([cx, -coreRad, baseZ]),
          localToWorld([cx - coreRad, 0, baseZ]),
        ];
        for (let i = 0; i < 4; i++) {
          const ni = (i + 1) % 4;
          fxTri(ringC[i], ringC[ni], tipC, 1.0, 0.98, 0.88, 0.96);
        }
      }
    }

    // 2. Thin White Wingtip Vapor Trails (camera-facing ribbon strips)
    for (const trail of [vaporLeft, vaporRight]) {
      if (trail.length < 2) continue;
      for (let i = 0; i < trail.length - 1; i++) {
        const p0 = trail[i];
        const p1 = trail[i + 1];
        const a0 = (1.0 - p0.age / 1.45) * p0.strength * 0.72;
        const a1 = (1.0 - p1.age / 1.45) * p1.strength * 0.72;
        if (a0 <= 0.02 && a1 <= 0.02) continue;
        const seg = [p1.pos[0] - p0.pos[0], p1.pos[1] - p0.pos[1], p1.pos[2] - p0.pos[2]];
        const toCam = [cam.eye[0] - p0.pos[0], cam.eye[1] - p0.pos[1], cam.eye[2] - p0.pos[2]];
        const side = v3Norm(v3Cross(seg, toCam));
        const w0 = 0.24 + (p0.age / 1.45) * 0.52;
        const w1 = 0.24 + (p1.age / 1.45) * 0.52;
        const v0 = [p0.pos[0] - side[0] * w0, p0.pos[1] - side[1] * w0, p0.pos[2] - side[2] * w0];
        const v1 = [p0.pos[0] + side[0] * w0, p0.pos[1] + side[1] * w0, p0.pos[2] + side[2] * w0];
        const v2 = [p1.pos[0] + side[0] * w1, p1.pos[1] + side[1] * w1, p1.pos[2] + side[2] * w1];
        const v3 = [p1.pos[0] - side[0] * w1, p1.pos[1] - side[1] * w1, p1.pos[2] - side[2] * w1];
        fxQuad(v0, v1, v2, v3, 0.96, 0.95, 0.92, (a0 + a1) * 0.5);
      }
    }

    // 3. Missile Rocket Flames
    for (const ms of activeMissiles) {
      const tail = [ms.pos[0] - ms.dir[0] * 1.4, ms.pos[1] - ms.dir[1] * 1.4, ms.pos[2] - ms.dir[2] * 1.4];
      const flameEnd = [ms.pos[0] - ms.dir[0] * 7.5, ms.pos[1] - ms.dir[1] * 7.5, ms.pos[2] - ms.dir[2] * 7.5];
      fxBillboard(tail, 1.45, cam.right, cam.camUp, 1.0, 0.96, 0.78, 0.95);
      const mid = [(tail[0] + flameEnd[0]) * 0.5, (tail[1] + flameEnd[1]) * 0.5, (tail[2] + flameEnd[2]) * 0.5];
      fxBillboard(mid, 1.1, cam.right, cam.camUp, 0.95, 0.45, 0.16, 0.85);
    }

    // 4. Expanding Impact Shockwave Rings
    for (const ring of shockRings) {
      const t = ring.age / ring.maxAge;
      const rOuter = lerp(4.0, ring.maxRadius, Math.pow(t, 0.62));
      const rInner = Math.max(0.5, rOuter - lerp(5.0, 2.0, t));
      const alpha = (1.0 - t) * 0.88;
      const col = ring.isWater ? [0.92, 0.95, 0.92] : [1.0, 0.86, 0.58];
      const segs = 20;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2;
        const a1 = ((i + 1) / segs) * Math.PI * 2;
        const c0 = Math.cos(a0), s0 = Math.sin(a0);
        const c1 = Math.cos(a1), s1 = Math.sin(a1);
        const p0 = [ring.pos[0] + c0 * rInner, ring.pos[1], ring.pos[2] + s0 * rInner];
        const p1 = [ring.pos[0] + c0 * rOuter, ring.pos[1], ring.pos[2] + s0 * rOuter];
        const p2 = [ring.pos[0] + c1 * rOuter, ring.pos[1], ring.pos[2] + s1 * rOuter];
        const p3 = [ring.pos[0] + c1 * rInner, ring.pos[1], ring.pos[2] + s1 * rInner];
        fxQuad(p0, p1, p2, p3, col[0], col[1], col[2], alpha);
      }
    }

    // 5. Particles (Explosions, Fireballs, Persistent Smoke, Water Splash Plumes, Embers)
    for (const p of particles) {
      if (p.age < 0) continue;
      const t = clamp(p.age / p.maxAge, 0, 1);
      const sz = lerp(p.size0, p.size1, Math.pow(t, 0.72));
      let r, g, b, a;
      if (p.kind === 'flash') {
        r = 1.0; g = 0.98; b = 0.88; a = 1.0 - t;
      } else if (p.kind === 'fire') {
        if (t < 0.25)      { r = 1.0;  g = 0.94; b = 0.68; }
        else if (t < 0.55) { r = 0.96; g = 0.56; b = 0.18; }
        else if (t < 0.82) { r = 0.84; g = 0.23; b = 0.25; }
        else               { r = 0.32; g = 0.19; b = 0.27; }
        a = (1.0 - t * t) * 0.94;
      } else if (p.kind === 'smoke') {
        const cool = lerp(0.16, 0.34, t);
        r = cool * 0.92; g = cool * 0.78; b = cool * 1.15;
        a = Math.sin(Math.min(1, t * 4.5) * Math.PI * 0.5) * (1.0 - t) * 0.84;
      } else if (p.kind === 'mslSmoke') {
        r = lerp(0.95, 0.62, t);
        g = lerp(0.84, 0.52, t);
        b = lerp(0.76, 0.64, t);
        a = (1.0 - t) * 0.72;
      } else if (p.kind === 'spray') {
        r = lerp(0.96, 0.55, t * 0.6);
        g = lerp(0.96, 0.80, t * 0.6);
        b = lerp(0.92, 0.78, t * 0.6);
        a = (1.0 - t * t) * 0.90;
      } else { // ember
        r = 1.0; g = lerp(0.78, 0.28, t); b = 0.14; a = 1.0 - t;
      }
      fxBillboard(p.pos, sz * 0.5, cam.right, cam.camUp, r, g, b, a);
    }
  }

  // =========================================================================
  // 12. RENDER WORLD (WEBGL2 3-PASS PIPELINE)
  // =========================================================================
  const impactPosArr = new Float32Array(MAX_IMPACTS * 4);
  const impactMetaArr = new Float32Array(MAX_IMPACTS * 4);

  function renderWebGL() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, internalW, internalH);

    // --- PASS 1: World Raymarch (Sky, Terrain, Water, Clouds, Shadows, Scorch/Foam) ---
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.ALWAYS);
    gl.depthMask(true);

    for (let i = 0; i < MAX_IMPACTS; i++) {
      const imp = impacts[i];
      impactPosArr[i * 4 + 0] = imp.pos[0];
      impactPosArr[i * 4 + 1] = imp.pos[1];
      impactPosArr[i * 4 + 2] = imp.pos[2];
      impactPosArr[i * 4 + 3] = imp.age;
      impactMetaArr[i * 4 + 0] = imp.isWater;
      impactMetaArr[i * 4 + 1] = imp.radius;
      impactMetaArr[i * 4 + 2] = imp.flash;
      impactMetaArr[i * 4 + 3] = 0;
    }

    gl.useProgram(progWorld);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, terrainTexA);
    gl.uniform1i(uWorld.uTerrainA, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, terrainTexB);
    gl.uniform1i(uWorld.uTerrainB, 1);

    gl.uniformMatrix4fv(uWorld.uInvViewProj, false, cam.invVpMat);
    gl.uniformMatrix4fv(uWorld.uViewProj, false, cam.vpMat);
    gl.uniform3fv(uWorld.uCamPos, cam.eye);
    gl.uniform3fv(uWorld.uSunDir, SUN_DIR);
    gl.uniform1f(uWorld.uTime, simTime);
    gl.uniform3fv(uWorld.uPlanePos, plane.pos);
    gl.uniform3fv(uWorld.uPlaneFwd, plane.fwd);
    gl.uniform3fv(uWorld.uPlaneRight, plane.right);
    gl.uniform4fv(uWorld.uImpacts, impactPosArr);
    gl.uniform4fv(uWorld.uImpactMeta, impactMetaArr);

    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // --- PASS 2a: Fighter Jet + Underwing Pylon Missiles + Flying Missiles ---
    gl.depthFunc(gl.LESS);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    gl.useProgram(progMesh);
    gl.uniformMatrix4fv(uMesh.uViewProj, false, cam.vpMat);
    gl.uniform3fv(uMesh.uSunDir, SUN_DIR);
    gl.uniform1f(uMesh.uBurnerGlow, plane.burner);
    gl.uniform1f(uMesh.uMaskId, 1.0);

    const drawFighter = !(cam.mode === 2 && cam.trans > 0.72);
    if (drawFighter) {
      gl.uniformMatrix4fv(uMesh.uModel, false, plane.modelMat);
      gl.bindVertexArray(fighterMesh.vao);
      gl.drawArrays(gl.TRIANGLES, 0, fighterMesh.count);

      // Draw loaded missiles attached under the wings
      gl.bindVertexArray(missileMesh.vao);
      for (let i = 0; i < 4; i++) {
        if (pylons[i].reload > 0) continue;
        const wp = localToWorld(pylons[i].offset);
        const back = [-plane.fwd[0], -plane.fwd[1], -plane.fwd[2]];
        const mMat = mat4FromBasisPos(plane.right, plane.up, back, wp, 1.0);
        gl.uniformMatrix4fv(uMesh.uModel, false, mMat);
        gl.drawArrays(gl.TRIANGLES, 0, missileMesh.count);
      }
    }

    // Draw flying missiles in the world
    if (activeMissiles.length > 0) {
      gl.bindVertexArray(missileMesh.vao);
      gl.uniform1f(uMesh.uBurnerGlow, 1.0);
      for (const ms of activeMissiles) {
        const back = [-ms.dir[0], -ms.dir[1], -ms.dir[2]];
        const upHint = Math.abs(ms.dir[1]) > 0.92 ? [1, 0, 0] : [0, 1, 0];
        const r = v3Norm(v3Cross(ms.dir, upHint));
        const u = v3Cross(r, ms.dir);
        const mMat = mat4FromBasisPos(r, u, back, ms.pos, 1.25);
        gl.uniformMatrix4fv(uMesh.uModel, false, mMat);
        gl.drawArrays(gl.TRIANGLES, 0, missileMesh.count);
      }
    }

    // --- PASS 2b: Translucent 3D FX (Plumes, Vapor, Explosions, Smoke, Spray, Shock Rings) ---
    buildFxGeometry();
    if (fxVertCount > 0) {
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.NONE]); // Never disturb aircraft mask!
      gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);

      gl.useProgram(progFx);
      gl.uniformMatrix4fv(uFx.uViewProj, false, cam.vpMat);
      gl.bindVertexArray(fxVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, fxBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxData.subarray(0, fxVertCount * 7));
      gl.drawArrays(gl.TRIANGLES, 0, fxVertCount);
    }

    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(true);

    // --- PASS 3: Fullscreen Post-Process (1px Dark Outline + 4x4 Bayer Dither + 48-Color Palette) ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, internalW, internalH);
    gl.useProgram(progPost);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboColorTex);
    gl.uniform1i(uPost.uColorTex, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fboMaskTex);
    gl.uniform1i(uPost.uMaskTex, 1);

    gl.uniform2f(uPost.uTexel, 1.0 / internalW, 1.0 / internalH);
    gl.uniform3fv(uPost.uPalette, PALETTE_RGB);
    gl.uniform1f(uPost.uFlash, screenFlash);

    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // =========================================================================
  // 13. CANVAS 2D PIXEL-ART COCKPIT & TRUE-HORIZON HUD (CRISP BITMAP FONT)
  // =========================================================================

  // Crisp 3x5 pixel bitmap font (guaranteed zero anti-aliasing blur at 340p!)
  const FONT3X5 = {
    '0': [0b111,0b101,0b101,0b101,0b111],
    '1': [0b010,0b110,0b010,0b010,0b111],
    '2': [0b111,0b001,0b111,0b100,0b111],
    '3': [0b111,0b001,0b111,0b001,0b111],
    '4': [0b101,0b101,0b111,0b001,0b001],
    '5': [0b111,0b100,0b111,0b001,0b111],
    '6': [0b111,0b100,0b111,0b101,0b111],
    '7': [0b111,0b001,0b010,0b010,0b010],
    '8': [0b111,0b101,0b111,0b101,0b111],
    '9': [0b111,0b101,0b111,0b001,0b111],
    'A': [0b010,0b101,0b111,0b101,0b101],
    'B': [0b110,0b101,0b110,0b101,0b110],
    'C': [0b111,0b100,0b100,0b100,0b111],
    'D': [0b110,0b101,0b101,0b101,0b110],
    'E': [0b111,0b100,0b110,0b100,0b111],
    'F': [0b111,0b100,0b110,0b100,0b100],
    'G': [0b111,0b100,0b101,0b101,0b111],
    'H': [0b101,0b101,0b111,0b101,0b101],
    'I': [0b111,0b010,0b010,0b010,0b111],
    'J': [0b001,0b001,0b001,0b101,0b111],
    'K': [0b101,0b101,0b110,0b101,0b101],
    'L': [0b100,0b100,0b100,0b100,0b111],
    'M': [0b101,0b111,0b111,0b101,0b101],
    'N': [0b111,0b101,0b101,0b101,0b101],
    'O': [0b111,0b101,0b101,0b101,0b111],
    'P': [0b111,0b101,0b111,0b100,0b100],
    'Q': [0b111,0b101,0b101,0b111,0b001],
    'R': [0b110,0b101,0b110,0b101,0b101],
    'S': [0b111,0b100,0b111,0b001,0b111],
    'T': [0b111,0b010,0b010,0b010,0b010],
    'U': [0b101,0b101,0b101,0b101,0b111],
    'V': [0b101,0b101,0b101,0b101,0b010],
    'W': [0b101,0b101,0b111,0b111,0b101],
    'X': [0b101,0b101,0b010,0b101,0b101],
    'Y': [0b101,0b101,0b010,0b010,0b010],
    'Z': [0b111,0b001,0b010,0b100,0b111],
    '-': [0b000,0b000,0b111,0b000,0b000],
    '+': [0b000,0b010,0b111,0b010,0b000],
    ':': [0b000,0b010,0b000,0b010,0b000],
    '.': [0b000,0b000,0b000,0b000,0b010],
    '/': [0b001,0b001,0b010,0b100,0b100],
    '%': [0b101,0b001,0b010,0b100,0b101],
    ' ': [0b000,0b000,0b000,0b000,0b000],
  };

  function pxRect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function pxLine(ctx, x0, y0, x1, y1, color, dashed = false) {
    x0 = Math.round(x0); y0 = Math.round(y0);
    x1 = Math.round(x1); y1 = Math.round(y1);
    ctx.fillStyle = color;
    let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    let step = 0;
    for (let guard = 0; guard < 1200; guard++) {
      if (!dashed || ((step >> 1) & 1) === 0) {
        ctx.fillRect(x0, y0, 1, 1);
      }
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
      step++;
    }
  }

  function pxCircleOutline(ctx, cx, cy, r, color) {
    cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
    ctx.fillStyle = color;
    let x = r, y = 0, err = 1 - r;
    while (x >= y) {
      ctx.fillRect(cx + x, cy + y, 1, 1); ctx.fillRect(cx + y, cy + x, 1, 1);
      ctx.fillRect(cx - y, cy + x, 1, 1); ctx.fillRect(cx - x, cy + y, 1, 1);
      ctx.fillRect(cx - x, cy - y, 1, 1); ctx.fillRect(cx - y, cy - x, 1, 1);
      ctx.fillRect(cx + y, cy - x, 1, 1); ctx.fillRect(cx + x, cy - y, 1, 1);
      y++;
      if (err < 0) err += 2 * y + 1;
      else { x--; err += 2 * (y - x + 1); }
    }
  }

  function pxCircleFill(ctx, cx, cy, r, color) {
    cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
    ctx.fillStyle = color;
    for (let dy = -r; dy <= r; dy++) {
      const span = Math.floor(Math.sqrt(r * r - dy * dy));
      ctx.fillRect(cx - span, cy + dy, span * 2 + 1, 1);
    }
  }

  function pxText(ctx, text, x, y, color, align = 'left', scale = 1) {
    const str = String(text).toUpperCase();
    const charW = 4 * scale;
    const totalW = str.length * charW - scale;
    let ox = Math.round(x);
    if (align === 'center') ox = Math.round(x - totalW * 0.5);
    else if (align === 'right') ox = Math.round(x - totalW);
    const oy = Math.round(y);
    ctx.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const glyph = FONT3X5[str[i]] || FONT3X5[' '];
      for (let row = 0; row < 5; row++) {
        const bits = glyph[row];
        if (bits & 4) ctx.fillRect(ox + i * charW,             oy + row * scale, scale, scale);
        if (bits & 2) ctx.fillRect(ox + i * charW + scale,     oy + row * scale, scale, scale);
        if (bits & 1) ctx.fillRect(ox + i * charW + 2 * scale, oy + row * scale, scale, scale);
      }
    }
  }

  // Persistent Amber Ground-Mapping Radar Phosphor Buffer
  const RADAR_SZ = 56;
  const radarBuf = new Float32Array(RADAR_SZ * RADAR_SZ);
  let radarSweepAngle = -Math.PI * 0.45;
  let radarSweepDir = 1;

  function updateRadarSweep(dt) {
    // Decay phosphor persistence
    const decay = Math.exp(-dt * 1.45);
    for (let i = 0; i < radarBuf.length; i++) radarBuf[i] *= decay;

    // Sweep beam back and forth across forward +/- 68 deg sector (true ground-mapping radar!)
    const prevAng = radarSweepAngle;
    const sweepSpd = 2.55;
    radarSweepAngle += radarSweepDir * sweepSpd * dt;
    if (radarSweepAngle > 1.18) { radarSweepAngle = 1.18; radarSweepDir = -1; }
    if (radarSweepAngle < -1.18) { radarSweepAngle = -1.18; radarSweepDir = 1; }

    // Paint several rays across the swept arc
    const samples = 5;
    const rangeM = 1150;
    const cx = RADAR_SZ * 0.5;
    const cy = RADAR_SZ - 6;
    const radPx = RADAR_SZ - 9;

    for (let s = 0; s < samples; s++) {
      const a = lerp(prevAng, radarSweepAngle, s / (samples - 1));
      const worldYaw = plane.yaw + a;
      const dirX = Math.sin(worldYaw);
      const dirZ = -Math.cos(worldYaw);
      for (let r = 3; r <= radPx; r++) {
        const frac = r / radPx;
        const dist = frac * rangeM;
        const wx = plane.pos[0] + dirX * dist;
        const wz = plane.pos[2] + dirZ * dist;
        const h = sampleTerrainMeters(wx, wz);
        let intensity;
        if (h <= 0.05) {
          intensity = 0.06; // dark calm lake water
        } else {
          // Bright amber terrain return proportional to elevation + ridge contrast
          intensity = clamp(0.28 + (h / MAX_TERRAIN_Y) * 0.92, 0.25, 1.0);
        }
        const px = Math.round(cx + Math.sin(a) * r);
        const py = Math.round(cy - Math.cos(a) * r);
        if (px >= 0 && px < RADAR_SZ && py >= 0 && py < RADAR_SZ) {
          radarBuf[py * RADAR_SZ + px] = Math.max(radarBuf[py * RADAR_SZ + px], intensity);
        }
      }
    }
  }

  function drawCockpitAndHud(dt) {
    const W = internalW;
    const H = internalH;
    hudCtx.clearRect(0, 0, W, H);

    // Subtle steering crosshair in Chase mode when player is active
    if (cam.mode === 1 && cam.trans > 0.6 && input.playerActive && !input.touchActive) {
      const mx = Math.round(input.mouseX * W);
      const my = Math.round(input.mouseY * H);
      const cx = Math.round(W * 0.5);
      const cy = Math.round(H * 0.5);
      // Center boresight dot
      pxRect(hudCtx, cx - 1, cy, 3, 1, 'rgba(255,229,163,0.45)');
      pxRect(hudCtx, cx, cy - 1, 1, 3, 'rgba(255,229,163,0.45)');
      // Cursor aim pips
      pxRect(hudCtx, mx - 4, my, 2, 1, '#ffe5a3');
      pxRect(hudCtx, mx + 3, my, 2, 1, '#ffe5a3');
      pxRect(hudCtx, mx, my - 4, 1, 2, '#ffe5a3');
      pxRect(hudCtx, mx, my + 3, 1, 2, '#ffe5a3');
    }

    // Compute cockpit visibility alpha during smooth 1s transitions
    let cockAlpha = 0;
    if (cam.mode === 2) cockAlpha = smoothstep(0.35, 0.92, cam.trans);
    else if (cam.prevMode === 2) cockAlpha = 1.0 - smoothstep(0.05, 0.58, cam.trans);

    if (cockAlpha <= 0.01) return;

    updateRadarSweep(dt);

    hudCtx.save();
    hudCtx.globalAlpha = cockAlpha;

    // -----------------------------------------------------------------------
    // A. HEAD-UP DISPLAY (HUD) — TRUE-HORIZON PROJECTED PITCH LADDER & TAPES
    // -----------------------------------------------------------------------
    const HUD_G  = '#7cff8a';
    const HUD_GD = '#3da35d';
    const HUD_W  = '#ffcf48';
    const HUD_R  = '#ff4b4b';
    const HUD_BG = 'rgba(18, 28, 22, 0.52)';

    const dashY = Math.round(H * 0.59); // Top edge of cockpit glareshield (clear above bottom hint bar!)

    // Clip HUD pitch ladder strictly to windscreen cleanly below top heading tape & above glareshield
    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.rect(Math.round(W * 0.16), 35, Math.round(W * 0.68), dashY - 37);
    hudCtx.clip();

    // True 3D World Horizon & Pitch Ladder projected via exact WebGL2 cam.vpMat!
    const fwdHoriz = v3Norm([plane.fwd[0], 0, plane.fwd[2]]);
    const rightHoriz = v3Norm(v3Cross(fwdHoriz, [0, 1, 0]));
    const projDist = 1000.0;

    for (let deg = -30; deg <= 30; deg += 5) {
      if (deg !== 0 && deg % 10 !== 0) continue; // 0, ±10, ±20, ±30
      const rad = deg * Math.PI / 180;
      const ca = Math.cos(rad), sa = Math.sin(rad);
      const dirC = [fwdHoriz[0] * ca, sa, fwdHoriz[2] * ca];
      const isHorizon = deg === 0;
      const halfSpan = isHorizon ? 260 : 125;
      const gapSpan = 34;

      const pLOuter = [cam.eye[0] + dirC[0] * projDist - rightHoriz[0] * halfSpan, cam.eye[1] + dirC[1] * projDist, cam.eye[2] + dirC[2] * projDist - rightHoriz[2] * halfSpan];
      const pLInner = [cam.eye[0] + dirC[0] * projDist - rightHoriz[0] * gapSpan,  cam.eye[1] + dirC[1] * projDist, cam.eye[2] + dirC[2] * projDist - rightHoriz[2] * gapSpan];
      const pRInner = [cam.eye[0] + dirC[0] * projDist + rightHoriz[0] * gapSpan,  cam.eye[1] + dirC[1] * projDist, cam.eye[2] + dirC[2] * projDist + rightHoriz[2] * gapSpan];
      const pROuter = [cam.eye[0] + dirC[0] * projDist + rightHoriz[0] * halfSpan, cam.eye[1] + dirC[1] * projDist, cam.eye[2] + dirC[2] * projDist + rightHoriz[2] * halfSpan];

      const sLO = projectPoint(cam.vpMat, pLOuter, W, H);
      const sLI = projectPoint(cam.vpMat, pLInner, W, H);
      const sRI = projectPoint(cam.vpMat, pRInner, W, H);
      const sRO = projectPoint(cam.vpMat, pROuter, W, H);

      if (sLO && sLI) {
        pxLine(hudCtx, sLO.x, sLO.y, sLI.x, sLI.y, isHorizon ? HUD_G : HUD_GD, deg < 0);
        // End ticks pointing toward horizon
        if (!isHorizon) {
          const tickSign = deg > 0 ? 1 : -1;
          const upDir = [plane.up[0] * tickSign * 14, plane.up[1] * tickSign * 14, plane.up[2] * tickSign * 14];
          const pLTick = [pLOuter[0] - upDir[0], pLOuter[1] - upDir[1], pLOuter[2] - upDir[2]];
          const sLT = projectPoint(cam.vpMat, pLTick, W, H);
          if (sLT) pxLine(hudCtx, sLO.x, sLO.y, sLT.x, sLT.y, HUD_GD);
          pxText(hudCtx, Math.abs(deg), sLO.x - 4, sLO.y - 2, HUD_G, 'right');
        }
      }
      if (sRI && sRO) {
        pxLine(hudCtx, sRI.x, sRI.y, sRO.x, sRO.y, isHorizon ? HUD_G : HUD_GD, deg < 0);
        if (!isHorizon) {
          const tickSign = deg > 0 ? 1 : -1;
          const upDir = [plane.up[0] * tickSign * 14, plane.up[1] * tickSign * 14, plane.up[2] * tickSign * 14];
          const pRTick = [pROuter[0] - upDir[0], pROuter[1] - upDir[1], pROuter[2] - upDir[2]];
          const sRT = projectPoint(cam.vpMat, pRTick, W, H);
          if (sRT) pxLine(hudCtx, sRO.x, sRO.y, sRT.x, sRT.y, HUD_GD);
          pxText(hudCtx, Math.abs(deg), sRO.x + 4, sRO.y - 2, HUD_G, 'left');
        }
      }
    }

    // Central Boresight / Velocity Vector Symbol (W-wing watermark at center)
    const cx = Math.round(W * 0.5);
    const cy = Math.round(H * 0.5);
    pxLine(hudCtx, cx - 10, cy, cx - 4, cy, HUD_G);
    pxLine(hudCtx, cx - 4, cy, cx - 2, cy + 3, HUD_G);
    pxLine(hudCtx, cx - 2, cy + 3, cx, cy, HUD_G);
    pxLine(hudCtx, cx, cy, cx + 2, cy + 3, HUD_G);
    pxLine(hudCtx, cx + 2, cy + 3, cx + 4, cy, HUD_G);
    pxLine(hudCtx, cx + 4, cy, cx + 10, cy, HUD_G);
    pxRect(hudCtx, cx, cy - 1, 1, 1, HUD_G);

    // Subtle mouse steer cue in Cockpit view
    if (input.playerActive && !input.touchActive) {
      const mx = Math.round(input.mouseX * W);
      const my = Math.round(input.mouseY * H);
      pxRect(hudCtx, mx - 2, my, 5, 1, HUD_GD);
      pxRect(hudCtx, mx, my - 2, 1, 5, HUD_GD);
    }
    hudCtx.restore();

    // Real values in aviation units
    const knots = Math.round(plane.speed * 1.94384);
    const altFt = Math.max(0, Math.round(plane.pos[1] * 3.28084));
    const raltFt = Math.max(0, Math.round(plane.radAlt * 3.28084));
    const hdgDeg = ((Math.round(plane.yaw * 180 / Math.PI) % 360) + 360) % 360;
    const readyMsl = pylons.filter((p) => p.reload <= 0).length;

    // Top Heading Tape
    const tapeW = 140;
    const tapeX = Math.round(W * 0.5 - tapeW * 0.5);
    const tapeY = 14;
    pxRect(hudCtx, tapeX, tapeY - 6, tapeW, 13, HUD_BG);
    pxLine(hudCtx, tapeX, tapeY + 6, tapeX + tapeW, tapeY + 6, HUD_GD);
    const pxPerDeg = 2.2;
    const baseDeg = Math.floor((hdgDeg - 35) / 5) * 5;
    for (let d = baseDeg; d <= hdgDeg + 35; d += 5) {
      const dx = Math.round(W * 0.5 + (d - hdgDeg) * pxPerDeg);
      if (dx < tapeX + 4 || dx > tapeX + tapeW - 4) continue;
      const major = (d % 10 === 0);
      pxLine(hudCtx, dx, tapeY + 6, dx, tapeY + (major ? 2 : 4), HUD_G);
      if (d % 30 === 0 && dx >= tapeX + 9 && dx <= tapeX + tapeW - 9) {
        const wd = ((d % 360) + 360) % 360;
        const lbl = wd === 0 ? 'N' : wd === 90 ? 'E' : wd === 180 ? 'S' : wd === 270 ? 'W' : String(Math.round(wd / 10)).padStart(2, '0');
        pxText(hudCtx, lbl, dx, tapeY - 4, HUD_G, 'center');
      }
    }
    // Heading digital box & caret
    pxRect(hudCtx, cx - 10, tapeY + 8, 21, 9, HUD_BG);
    pxLine(hudCtx, cx - 10, tapeY + 8, cx + 10, tapeY + 8, HUD_G);
    pxLine(hudCtx, cx - 10, tapeY + 16, cx + 10, tapeY + 16, HUD_G);
    pxLine(hudCtx, cx - 10, tapeY + 8, cx - 10, tapeY + 16, HUD_G);
    pxLine(hudCtx, cx + 10, tapeY + 8, cx + 10, tapeY + 16, HUD_G);
    pxText(hudCtx, String(hdgDeg).padStart(3, '0'), cx, tapeY + 10, HUD_G, 'center');

    // Left Airspeed Tape (KTS)
    const spdX = Math.round(W * 0.16);
    const tapeTop = 44;
    const tapeBot = dashY - 26;
    const tapeMidY = Math.round((tapeTop + tapeBot) * 0.5);
    pxLine(hudCtx, spdX, tapeTop, spdX, tapeBot, HUD_GD);
    const baseKts = Math.floor((knots - 80) / 10) * 10;
    for (let k = baseKts; k <= knots + 80; k += 10) {
      if (k < 0) continue;
      const ky = Math.round(tapeMidY - (k - knots) * 0.72);
      if (ky < tapeTop + 2 || ky > tapeBot - 2) continue;
      const major = k % 20 === 0;
      pxLine(hudCtx, spdX - (major ? 5 : 3), ky, spdX, ky, HUD_G);
      if (major && Math.abs(ky - tapeMidY) > 7) {
        pxText(hudCtx, k, spdX - 7, ky - 2, HUD_GD, 'right');
      }
    }
    pxRect(hudCtx, spdX - 24, tapeMidY - 5, 22, 10, HUD_BG);
    pxLine(hudCtx, spdX - 24, tapeMidY - 5, spdX - 2, tapeMidY - 5, HUD_G);
    pxLine(hudCtx, spdX - 24, tapeMidY + 4, spdX - 2, tapeMidY + 4, HUD_G);
    pxLine(hudCtx, spdX - 24, tapeMidY - 5, spdX - 24, tapeMidY + 4, HUD_G);
    pxLine(hudCtx, spdX - 2, tapeMidY - 5, spdX - 2, tapeMidY + 4, HUD_G);
    pxText(hudCtx, String(knots).padStart(3, '0'), spdX - 4, tapeMidY - 2, HUD_G, 'right');
    pxText(hudCtx, 'KTS', spdX - 2, tapeTop - 8, HUD_GD, 'right');

    // Right Altitude Tape (FT)
    const altX = Math.round(W * 0.84);
    pxLine(hudCtx, altX, tapeTop, altX, tapeBot, HUD_GD);
    const baseAlt = Math.floor((altFt - 400) / 50) * 50;
    for (let a = baseAlt; a <= altFt + 400; a += 50) {
      if (a < 0) continue;
      const ay = Math.round(tapeMidY - (a - altFt) * 0.14);
      if (ay < tapeTop + 2 || ay > tapeBot - 2) continue;
      const major = a % 100 === 0;
      pxLine(hudCtx, altX, ay, altX + (major ? 5 : 3), ay, HUD_G);
      if (major && Math.abs(ay - tapeMidY) > 7) {
        pxText(hudCtx, a, altX + 7, ay - 2, HUD_GD, 'left');
      }
    }
    pxRect(hudCtx, altX + 2, tapeMidY - 5, 25, 10, HUD_BG);
    pxLine(hudCtx, altX + 2, tapeMidY - 5, altX + 26, tapeMidY - 5, HUD_G);
    pxLine(hudCtx, altX + 2, tapeMidY + 4, altX + 26, tapeMidY + 4, HUD_G);
    pxLine(hudCtx, altX + 2, tapeMidY - 5, altX + 2, tapeMidY + 4, HUD_G);
    pxLine(hudCtx, altX + 26, tapeMidY - 5, altX + 26, tapeMidY + 4, HUD_G);
    pxText(hudCtx, String(altFt).padStart(4, '0'), altX + 4, tapeMidY - 2, HUD_G, 'left');
    pxText(hudCtx, 'ALT', altX + 2, tapeTop - 8, HUD_GD, 'left');

    // HUD Bottom Corner Data: G-Load, Missile Count, Radar Altitude (subtle dark backing for legibility over golden sky!)
    pxRect(hudCtx, spdX - 26, tapeBot + 4, 34, 17, HUD_BG);
    pxText(hudCtx, 'G ' + plane.gLoad.toFixed(1), spdX - 24, tapeBot + 6, plane.gLoad > 4.5 ? HUD_W : HUD_G, 'left');
    pxText(hudCtx, 'MSL ' + readyMsl + '/4', spdX - 24, tapeBot + 14, readyMsl === 0 ? HUD_W : HUD_G, 'left');
    pxRect(hudCtx, altX - 16, tapeBot + 4, 44, plane.burner > 0.25 ? 17 : 9, HUD_BG);
    pxText(hudCtx, 'RALT ' + String(raltFt).padStart(4, '0'), altX + 26, tapeBot + 6, plane.lowAlt ? HUD_W : HUD_G, 'right');
    if (plane.burner > 0.25) {
      pxText(hudCtx, 'A/B', altX + 26, tapeBot + 14, HUD_W, 'right');
    }

    // Center HUD Warnings (flashing!)
    const flashOn = ((Math.floor(simTime * 6) & 1) === 0);
    if (plane.pullUp && flashOn) {
      pxRect(hudCtx, cx - 22, dashY - 24, 44, 11, 'rgba(60,10,16,0.75)');
      pxText(hudCtx, 'PULL UP', cx, dashY - 21, HUD_R, 'center');
    } else if (plane.lowAlt && flashOn) {
      pxText(hudCtx, 'LOW ALT', cx, dashY - 21, HUD_W, 'center');
    } else if (readyMsl === 0) {
      pxText(hudCtx, 'RELOADING', cx, dashY - 21, HUD_W, 'center');
    }

    // -----------------------------------------------------------------------
    // B. CANOPY FRAME ARCH & HAND-DRAWN PIXEL COCKPIT DASHBOARD
    // -----------------------------------------------------------------------
    const C_METAL_DK = '#15131f';
    const C_METAL_MD = '#272436';
    const C_METAL_LT = '#3f3b52';
    const C_METAL_HI = '#5b5670';
    const C_BEZEL    = '#100d18';
    const C_FACE     = '#1b1a26';
    const C_TICK     = '#b6c0cf';
    const C_NEEDLE   = '#ffe5a3';
    const C_ORANGE   = '#f25c2a';
    const C_AMBER    = '#f5b53d';

    // Canopy side struts & top arch framing windscreen (sealed seamlessly into glareshield!)
    hudCtx.fillStyle = C_METAL_DK;
    // Left canopy strut
    hudCtx.beginPath();
    hudCtx.moveTo(0, 0); hudCtx.lineTo(26, 0); hudCtx.lineTo(14, dashY + 26); hudCtx.lineTo(0, dashY + 26);
    hudCtx.closePath(); hudCtx.fill();
    // Right canopy strut
    hudCtx.beginPath();
    hudCtx.moveTo(W, 0); hudCtx.lineTo(W - 26, 0); hudCtx.lineTo(W - 14, dashY + 26); hudCtx.lineTo(W, dashY + 26);
    hudCtx.closePath(); hudCtx.fill();
    // Top canopy bow bar
    pxRect(hudCtx, 0, 0, W, 6, C_METAL_DK);
    pxRect(hudCtx, 22, 6, W - 44, 2, C_METAL_MD);
    // Strut bevel highlight
    pxLine(hudCtx, 26, 0, 14, dashY + 8, C_METAL_LT);
    pxLine(hudCtx, W - 26, 0, W - 14, dashY + 8, C_METAL_LT);

    // Sculpted Glareshield & Main Instrument Panel Silhouette
    const panelX0 = Math.round(W * 0.04);
    const panelX1 = Math.round(W * 0.96);
    const hoodX0  = Math.round(W * 0.34);
    const hoodX1  = Math.round(W * 0.66);
    const hoodY   = dashY - 6;

    // Full bottom panel backdrop
    hudCtx.fillStyle = C_METAL_MD;
    hudCtx.beginPath();
    hudCtx.moveTo(0, dashY + 14);
    hudCtx.lineTo(panelX0, dashY + 4);
    hudCtx.lineTo(hoodX0, dashY + 2);
    hudCtx.lineTo(hoodX0 + 14, hoodY);
    hudCtx.lineTo(hoodX1 - 14, hoodY);
    hudCtx.lineTo(hoodX1, dashY + 2);
    hudCtx.lineTo(panelX1, dashY + 4);
    hudCtx.lineTo(W, dashY + 14);
    hudCtx.lineTo(W, H);
    hudCtx.lineTo(0, H);
    hudCtx.closePath();
    hudCtx.fill();

    // Dark glareshield top lip + metallic highlight bevel
    pxLine(hudCtx, 0, dashY + 14, panelX0, dashY + 4, C_METAL_HI);
    pxLine(hudCtx, panelX0, dashY + 4, hoodX0, dashY + 2, C_METAL_HI);
    pxLine(hudCtx, hoodX0, dashY + 2, hoodX0 + 14, hoodY, C_METAL_HI);
    pxLine(hudCtx, hoodX0 + 14, hoodY, hoodX1 - 14, hoodY, C_METAL_HI);
    pxLine(hudCtx, hoodX1 - 14, hoodY, hoodX1, dashY + 2, C_METAL_HI);
    pxLine(hudCtx, hoodX1, dashY + 2, panelX1, dashY + 4, C_METAL_HI);
    pxLine(hudCtx, panelX1, dashY + 4, W, dashY + 14, C_METAL_HI);

    // Subtle panel seam lines & rivets
    const pTop = dashY + 8;
    const pH = H - pTop;
    pxRect(hudCtx, 0, dashY + 14, W, 2, C_METAL_DK);
    for (let rx = 28; rx < W - 28; rx += 34) {
      pxRect(hudCtx, rx, dashY + 11, 2, 2, C_METAL_LT);
    }

    // Responsive horizontal instrument layout centered across panel width (clear of bottom hint bar)
    const midX = Math.round(W * 0.5);
    const dialR = Math.min(20, Math.max(15, Math.floor((H - dashY - 18) * 0.17)));
    const row1Y = Math.round(dashY + 34);
    const row2Y = Math.round(row1Y + dialR * 2 + 9);

    // --- 1. THROTTLE LEVER (Far Left, moves forward with Afterburner!) ---
    const thrX = Math.max(18, Math.round(W * 0.085));
    const thrTop = dashY + 24;
    const thrH = Math.min(64, H - thrTop - 30);
    pxRect(hudCtx, thrX - 10, thrTop - 4, 21, thrH + 10, C_METAL_DK);
    pxRect(hudCtx, thrX - 9, thrTop - 3, 19, thrH + 8, '#1e1b2b');
    // Slot track + AB zone indicator
    pxRect(hudCtx, thrX - 2, thrTop + 2, 5, thrH - 4, '#0c0912');
    pxRect(hudCtx, thrX + 5, thrTop + 2, 3, Math.round(thrH * 0.28), plane.burner > 0.2 ? C_ORANGE : '#592825');
    pxText(hudCtx, 'AB', thrX + 1, thrTop - 11, plane.burner > 0.2 ? C_AMBER : '#7c6391', 'center');
    pxText(hudCtx, 'THR', thrX + 1, thrTop + thrH + 8, '#8a7c94', 'center');
    // Moving throttle handle
    const thrNorm = clamp((plane.throttle - 0.5) / 0.5, 0, 1); // 0.24 cruise -> 1.0 full AB
    const handleY = Math.round(thrTop + thrH - 8 - thrNorm * (thrH - 16));
    pxRect(hudCtx, thrX - 9, handleY - 4, 19, 9, C_BEZEL);
    pxRect(hudCtx, thrX - 8, handleY - 3, 17, 7, C_METAL_LT);
    pxRect(hudCtx, thrX - 7, handleY - 2, 15, 2, C_METAL_HI);
    pxRect(hudCtx, thrX - 4, handleY + 1, 9, 2, plane.burner > 0.2 ? C_AMBER : C_METAL_DK);

    // --- 2. ENGINE INSTRUMENTS (RPM & EGT Twin Bars, Left-Mid) ---
    const engX = Math.max(thrX + 26, Math.round(W * 0.17));
    const engY = dashY + 24;
    const engH = Math.min(54, H - engY - 38);
    pxRect(hudCtx, engX - 18, engY - 4, 38, engH + 22, C_BEZEL);
    pxRect(hudCtx, engX - 17, engY - 3, 36, engH + 20, C_FACE);
    pxText(hudCtx, 'ENG', engX + 1, engY - 1, '#b6c0cf', 'center');

    const rpmVal = clamp(0.72 + plane.burner * 0.26 + Math.sin(simTime * 19) * 0.01, 0, 1);
    const egtVal = clamp(0.55 + plane.burner * 0.41 + Math.cos(simTime * 13) * 0.015, 0, 1);
    const bars = [
      { x: engX - 14, v: rpmVal, lbl: 'L', col: rpmVal > 0.9 ? C_ORANGE : '#7cff8a' },
      { x: engX - 6,  v: rpmVal * 0.99, lbl: 'R', col: rpmVal > 0.9 ? C_ORANGE : '#7cff8a' },
      { x: engX + 4,  v: egtVal, lbl: 'T', col: egtVal > 0.82 ? '#ff4b4b' : C_AMBER },
      { x: engX + 12, v: egtVal * 0.98, lbl: 'T', col: egtVal > 0.82 ? '#ff4b4b' : C_AMBER },
    ];
    const barBase = engY + engH + 6;
    const barMaxH = engH - 6;
    for (const b of bars) {
      pxRect(hudCtx, b.x, engY + 7, 5, barMaxH, '#0f0d18');
      const fillH = Math.max(2, Math.round(b.v * barMaxH));
      pxRect(hudCtx, b.x + 1, barBase - fillH, 3, fillH, b.col);
      pxText(hudCtx, b.lbl, b.x + 2, barBase + 3, '#7e899c', 'center');
    }
    pxText(hudCtx, 'RPM EGT', engX + 1, barBase + 10, '#7c6391', 'center');

    // Helper for analog round dial bezel
    function drawDialBase(x, y, r, label) {
      pxCircleFill(hudCtx, x, y, r + 2, C_BEZEL);
      pxCircleOutline(hudCtx, x, y, r + 2, C_METAL_LT);
      pxCircleFill(hudCtx, x, y, r, C_FACE);
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 - Math.PI * 0.5;
        const x0 = x + Math.cos(a) * (r - 1);
        const y0 = y + Math.sin(a) * (r - 1);
        const x1 = x + Math.cos(a) * (r - (i % 3 === 0 ? 4 : 2));
        const y1 = y + Math.sin(a) * (r - (i % 3 === 0 ? 4 : 2));
        pxLine(hudCtx, x0, y0, x1, y1, i % 3 === 0 ? C_TICK : '#62566e');
      }
      if (label) pxText(hudCtx, label, x, y + Math.round(r * 0.42), '#7e899c', 'center');
    }

    // --- 3. AIRSPEED INDICATOR (ASI) ---
    const asiX = Math.round(midX - dialR * 3.55);
    drawDialBase(asiX, row1Y, dialR, 'IAS');
    const asiAng = -Math.PI * 0.5 + clamp((knots - 150) / 450, 0, 1) * Math.PI * 1.8;
    pxLine(hudCtx, asiX, row1Y, asiX + Math.cos(asiAng) * (dialR - 3), row1Y + Math.sin(asiAng) * (dialR - 3), C_NEEDLE);
    pxCircleFill(hudCtx, asiX, row1Y, 2, C_METAL_HI);
    pxText(hudCtx, knots, asiX, row1Y - Math.round(dialR * 0.52), C_TICK, 'center');

    // --- 4. TURN & SLIP COORDINATOR (Below ASI) ---
    drawDialBase(asiX, row2Y, dialR - 1, '');
    const tcR = dialR - 1;
    // Miniature banking airplane
    const turnAng = clamp(plane.turnRate * 0.45, -0.58, 0.58);
    const tcX = Math.cos(turnAng) * (tcR - 6);
    const tcY = Math.sin(turnAng) * (tcR - 6);
    pxLine(hudCtx, asiX - tcX, row2Y - 2 - tcY, asiX + tcX, row2Y - 2 + tcY, '#e6e2d3');
    pxLine(hudCtx, asiX, row2Y - 2, asiX + Math.sin(turnAng) * 5, row2Y - 2 - Math.cos(turnAng) * 5, '#e6e2d3');
    // Curved slip ball tube
    pxRect(hudCtx, asiX - 10, row2Y + 6, 21, 5, '#0c0a14');
    pxLine(hudCtx, asiX - 3, row2Y + 6, asiX - 3, row2Y + 10, '#7e899c');
    pxLine(hudCtx, asiX + 3, row2Y + 6, asiX + 3, row2Y + 10, '#7e899c');
    const ballX = Math.round(asiX + clamp(plane.slip, -1, 1) * 7);
    pxRect(hudCtx, ballX - 1, row2Y + 7, 3, 3, '#ffe5a3');
    pxText(hudCtx, 'TRN', asiX, row2Y - tcR + 4, '#7e899c', 'center');

    // --- 5. ARTIFICIAL HORIZON / ATTITUDE INDICATOR (Center Top, True Roll & Pitch!) ---
    const adiX = Math.round(midX - dialR * 1.18);
    const adiR = dialR + 2;
    pxCircleFill(hudCtx, adiX, row1Y, adiR + 2, C_BEZEL);
    pxCircleOutline(hudCtx, adiX, row1Y, adiR + 2, C_METAL_HI);

    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.arc(adiX, row1Y, adiR, 0, Math.PI * 2);
    hudCtx.clip();

    // Rotate by aircraft roll & shift by pitch
    hudCtx.translate(adiX, row1Y);
    hudCtx.rotate(-plane.visualRoll);
    const pitchPx = clamp(plane.pitch * 30, -adiR, adiR);
    // Sky half (cerulean) & Earth half (warm russet-brown)
    pxRect(hudCtx, -adiR * 2, -adiR * 2 + pitchPx, adiR * 4, adiR * 2, '#2f6b80');
    pxRect(hudCtx, -adiR * 2, pitchPx, adiR * 4, adiR * 2, '#7d442b');
    pxRect(hudCtx, -adiR * 2, pitchPx, adiR * 4, 1, '#fff7d6');
    // Pitch marks on ball
    for (const dp of [-10, -5, 5, 10]) {
      const py = Math.round(pitchPx + dp * 1.1);
      const pw = (Math.abs(dp) === 10) ? 7 : 4;
      pxRect(hudCtx, -pw, py, pw * 2 + 1, 1, '#e6e2d3');
    }
    hudCtx.restore();

    // Fixed yellow center aircraft reference bars
    pxRect(hudCtx, adiX - 10, row1Y, 7, 2, C_AMBER);
    pxRect(hudCtx, adiX + 4, row1Y, 7, 2, C_AMBER);
    pxRect(hudCtx, adiX - 1, row1Y - 1, 3, 3, C_AMBER);
    pxCircleOutline(hudCtx, adiX, row1Y, adiR, C_BEZEL);

    // --- 6. HEADING INDICATOR / COMPASS ROSE (Below ADI) ---
    drawDialBase(adiX, row2Y, dialR, '');
    const hsiR = dialR;
    const hRad = plane.yaw;
    const cardinals = [
      { lbl: 'N', a: 0, col: '#ff4b4b' },
      { lbl: 'E', a: Math.PI * 0.5, col: '#e6e2d3' },
      { lbl: 'S', a: Math.PI, col: '#e6e2d3' },
      { lbl: 'W', a: Math.PI * 1.5, col: '#e6e2d3' },
    ];
    for (const c of cardinals) {
      const ang = c.a - hRad - Math.PI * 0.5;
      const lx = adiX + Math.cos(ang) * (hsiR - 6);
      const ly = row2Y + Math.sin(ang) * (hsiR - 6) - 2;
      pxText(hudCtx, c.lbl, lx, ly, c.col, 'center');
    }
    // Center miniature jet symbol + top lubber triangle
    pxLine(hudCtx, adiX, row2Y - 5, adiX, row2Y + 5, C_AMBER);
    pxLine(hudCtx, adiX - 5, row2Y + 1, adiX + 5, row2Y + 1, C_AMBER);
    pxRect(hudCtx, adiX - 1, row2Y - hsiR, 3, 3, C_ORANGE);

    // --- 7. ALTIMETER WITH DIGITAL READOUT (Center-Right Top) ---
    const altDialX = Math.round(midX + dialR * 1.18);
    drawDialBase(altDialX, row1Y, dialR, 'ALT');
    // 1000-ft short thick hand + 100-ft long needle
    const a1000 = -Math.PI * 0.5 + ((altFt % 10000) / 10000) * Math.PI * 2;
    const a100  = -Math.PI * 0.5 + ((altFt % 1000) / 1000) * Math.PI * 2;
    pxLine(hudCtx, altDialX, row1Y, altDialX + Math.cos(a1000) * (dialR * 0.55), row1Y + Math.sin(a1000) * (dialR * 0.55), '#b6c0cf');
    pxLine(hudCtx, altDialX, row1Y, altDialX + Math.cos(a100) * (dialR - 3), row1Y + Math.sin(a100) * (dialR - 3), C_NEEDLE);
    pxCircleFill(hudCtx, altDialX, row1Y, 2, C_METAL_HI);
    // Digital feet drum window inside altimeter!
    pxRect(hudCtx, altDialX - 11, row1Y - 10, 23, 8, '#0b0912');
    pxText(hudCtx, String(altFt).padStart(4, '0'), altDialX, row1Y - 8, '#7cff8a', 'center');

    // --- 8. VERTICAL SPEED INDICATOR (VSI, Below Altimeter) ---
    drawDialBase(altDialX, row2Y, dialR - 1, 'VSI');
    // VSI in thousands of ft/min (zero at 9 o'clock!)
    const fpm = plane.vSpeed * 196.85;
    const vsiNorm = clamp(fpm / 4500, -1, 1);
    const vsiAng = Math.PI + vsiNorm * (Math.PI * 0.78);
    pxLine(hudCtx, altDialX, row2Y, altDialX + Math.cos(vsiAng) * (dialR - 4), row2Y + Math.sin(vsiAng) * (dialR - 4), C_NEEDLE);
    pxCircleFill(hudCtx, altDialX, row2Y, 2, C_METAL_HI);
    pxText(hudCtx, (fpm >= 0 ? '+' : '') + Math.round(fpm / 100), altDialX, row2Y - Math.round(dialR * 0.54), '#b6c0cf', 'center');

    // --- 9. AMBER GROUND-MAPPING RADAR WITH LIVE SWEEP (Right-Center) ---
    const rdrW = Math.min(RADAR_SZ, Math.max(46, Math.floor((H - dashY) * 0.52)));
    const rdrX = Math.round(midX + dialR * 2.65);
    const rdrY = dashY + 20;
    pxRect(hudCtx, rdrX - 3, rdrY - 3, rdrW + 6, rdrW + 14, C_BEZEL);
    pxLine(hudCtx, rdrX - 3, rdrY - 3, rdrX + rdrW + 2, rdrY - 3, C_METAL_HI);
    pxRect(hudCtx, rdrX, rdrY, rdrW, rdrW, '#170d04');

    // Paint live terrain heightfield phosphor buffer onto radar CRT
    const scaleR = RADAR_SZ / rdrW;
    for (let py = 0; py < rdrW; py++) {
      const sy = Math.min(RADAR_SZ - 1, Math.floor(py * scaleR));
      for (let px = 0; px < rdrW; px++) {
        const sx = Math.min(RADAR_SZ - 1, Math.floor(px * scaleR));
        const v = radarBuf[sy * RADAR_SZ + sx];
        if (v < 0.05) continue;
        // 4 crisp stepped amber CRT tones
        let col;
        if (v < 0.24)      col = '#381e06';
        else if (v < 0.50) col = '#7a440d';
        else if (v < 0.78) col = '#cc7b18';
        else               col = '#ffcf5c';
        hudCtx.fillStyle = col;
        hudCtx.fillRect(rdrX + px, rdrY + py, 1, 1);
      }
    }
    // Radar range arcs & live glowing amber sweep line (strictly clipped inside CRT bezel!)
    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.rect(rdrX, rdrY, rdrW, rdrW);
    hudCtx.clip();
    const rCx = rdrX + Math.round(rdrW * 0.5);
    const rCy = rdrY + rdrW - 5;
    const sweepLen = rdrW - 7;
    pxCircleOutline(hudCtx, rCx, rCy, Math.round(rdrW * 0.42), '#59330a');
    pxCircleOutline(hudCtx, rCx, rCy, Math.round(rdrW * 0.78), '#59330a');
    pxLine(hudCtx, rCx, rCy, rCx + Math.sin(radarSweepAngle) * sweepLen, rCy - Math.cos(radarSweepAngle) * sweepLen, '#ffe5a3');
    // Own aircraft blip at bottom center
    pxRect(hudCtx, rCx - 2, rCy, 5, 1, '#fff7d6');
    pxRect(hudCtx, rCx, rCy - 2, 1, 3, '#fff7d6');
    hudCtx.restore();
    pxText(hudCtx, 'GND RDR', rdrX + rdrW * 0.5, rdrY + rdrW + 3, C_AMBER, 'center');

    // --- 10. WARNING LIGHTS ANNUNCIATOR PANEL & LOCAL TIME CLOCK (Far Right) ---
    const rightX = Math.min(W - 56, rdrX + rdrW + 10);
    const warnY = dashY + 20;
    const lamps = [
      { txt: 'PULL UP', on: plane.pullUp && flashOn, col: '#ff4b4b', bg: '#4a1118' },
      { txt: 'LOW ALT', on: plane.lowAlt,            col: '#ffcf48', bg: '#45310c' },
      { txt: 'A/B ON',  on: plane.burner > 0.25,     col: '#f25c2a', bg: '#451c0d' },
      { txt: 'G-LIMIT', on: plane.gLoad > 4.6,       col: '#ffcf48', bg: '#45310c' },
      { txt: 'MSL RDY', on: readyMsl > 0,            col: '#7cff8a', bg: '#13361c' },
    ];
    for (let i = 0; i < lamps.length; i++) {
      const ly = warnY + i * 11;
      const lp = lamps[i];
      pxRect(hudCtx, rightX, ly, 42, 9, C_BEZEL);
      pxRect(hudCtx, rightX + 1, ly + 1, 40, 7, lp.on ? lp.bg : '#151220');
      pxText(hudCtx, lp.txt, rightX + 21, ly + 2, lp.on ? lp.col : '#433c54', 'center');
    }

    // Local Time Cockpit Clock (Real system local time!)
    const clkY = warnY + lamps.length * 11 + 5;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    pxRect(hudCtx, rightX, clkY, 42, 16, C_BEZEL);
    pxRect(hudCtx, rightX + 1, clkY + 1, 40, 14, '#110f1a');
    pxText(hudCtx, 'LOCAL', rightX + 21, clkY + 2, '#7e899c', 'center');
    pxText(hudCtx, hh + ':' + mm + ':' + ss, rightX + 21, clkY + 9, C_AMBER, 'center');

    hudCtx.restore();
  }

  // =========================================================================
  // 14. UI SYNC, INPUT BINDINGS (MOUSE, KEYBOARD, TOUCH)
  // =========================================================================
  const mslPips = Array.from(document.querySelectorAll('#mslSlots .msl-pip'));
  const titleCard = document.getElementById('titleCard');
  const soundBtn = document.getElementById('soundBtn');
  const viewBtn = document.getElementById('viewBtn');
  const touchControlsEl = document.getElementById('touchControls');

  function dismissTitle() {
    if (!input.playerActive) {
      input.playerActive = true;
      titleCard.classList.add('dismissed');
    }
  }

  function updateMissileHudDom() {
    for (let i = 0; i < 4; i++) {
      const r = pylons[i].reload;
      const pip = mslPips[i];
      const bar = pip.firstElementChild;
      if (r <= 0) {
        pip.classList.add('ready');
        bar.style.height = '0%';
      } else {
        pip.classList.remove('ready');
        const frac = 1.0 - (r / MISSILE_RELOAD_TIME);
        bar.style.height = Math.round(frac * 100) + '%';
      }
    }
  }

  // Pointer / Mouse Inputs — LMB & RMB handled strictly independently so they work together!
  const stage = document.getElementById('stage');
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('mousemove', (e) => {
    if (input.touchActive) return;
    input.mouseX = clamp(e.clientX / Math.max(1, window.innerWidth), 0, 1);
    input.mouseY = clamp(e.clientY / Math.max(1, window.innerHeight), 0, 1);
    dismissTitle();
  });

  stage.addEventListener('mousedown', (e) => {
    dismissTitle();
    if (e.button === 0) {
      input.lmbDown = true;
      input.lmbHoldTime = 0;
    } else if (e.button === 2) {
      e.preventDefault();
      input.rmbDown = true;
      fireMissile();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0 && input.lmbDown) {
      const heldFor = input.lmbHoldTime;
      input.lmbDown = false;
      input.lmbHoldTime = 0;
      // Short LMB click = Barrel Roll! (Even while RMB is pressed or just fired!)
      if (heldFor < 0.22) {
        triggerBarrelRoll();
      }
    } else if (e.button === 2) {
      input.rmbDown = false;
    }
  });

  window.addEventListener('blur', () => {
    input.lmbDown = false;
    input.rmbDown = false;
    input.touchBurn = false;
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space') {
      e.preventDefault();
      cycleCamera();
    } else if (e.code === 'KeyF') {
      e.preventDefault();
      dismissTitle();
      fireMissile();
    } else if (e.code === 'KeyM') {
      toggleSound();
    }
  });

  function toggleSound() {
    const next = !sfx.enabled;
    sfx.setEnabled(next);
    soundBtn.textContent = next ? 'SFX ON' : 'SFX OFF';
    soundBtn.classList.toggle('on', next);
  }
  soundBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
  viewBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleCamera(); });

  // Touch Controls (Auto-activated on touchscreens)
  const touchStick = document.getElementById('touchStick');
  const touchKnob = document.getElementById('touchKnob');
  let stickTouchId = null;

  function enableTouchUI() {
    if (!input.touchActive) {
      input.touchActive = true;
      touchControlsEl.classList.add('active');
    }
  }
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      enableTouchUI();
    }
  }
  window.addEventListener('touchstart', () => { enableTouchUI(); dismissTitle(); }, { passive: true });

  function updateStickFromTouch(touch) {
    const rect = touchStick.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    const maxR = rect.width * 0.42;
    let dx = (touch.clientX - cx) / maxR;
    let dy = (touch.clientY - cy) / maxR;
    const d = Math.hypot(dx, dy);
    if (d > 1) { dx /= d; dy /= d; }
    input.touchStickX = dx;
    input.touchStickY = dy;
    touchKnob.style.transform = `translate(${Math.round(dx * maxR)}px, ${Math.round(dy * maxR)}px)`;
  }

  touchStick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    enableTouchUI();
    dismissTitle();
    const t = e.changedTouches[0];
    stickTouchId = t.identifier;
    updateStickFromTouch(t);
  }, { passive: false });

  touchStick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) updateStickFromTouch(t);
    }
  }, { passive: false });

  function resetStick(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) {
        stickTouchId = null;
        input.touchStickX = 0;
        input.touchStickY = 0;
        touchKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  }
  touchStick.addEventListener('touchend', resetStick);
  touchStick.addEventListener('touchcancel', resetStick);

  function bindTouchBtn(id, onDown, onUp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('pressed'); onDown(); }, { passive: false });
    const end = (e) => { e.preventDefault(); el.classList.remove('pressed'); if (onUp) onUp(); };
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
  }
  bindTouchBtn('btnView', () => cycleCamera());
  bindTouchBtn('btnRoll', () => { dismissTitle(); triggerBarrelRoll(); });
  bindTouchBtn('btnBurn', () => { dismissTitle(); input.touchBurn = true; }, () => { input.touchBurn = false; });
  bindTouchBtn('btnFire', () => { dismissTitle(); fireMissile(); });

  // =========================================================================
  // 15. DYNAMIC RESOLUTION SCALER & MAIN LOOP
  // =========================================================================
  let frameAvgMs = 16.6;
  let scaleCooldown = 2.5;
  let lastTs = 0;
  let rafId = 0;
  let running = false;

  function maybeAdaptResolution(dt, frameMs) {
    frameAvgMs = lerp(frameAvgMs, clamp(frameMs, 4, 120), 0.06);
    scaleCooldown -= dt;
    if (scaleCooldown > 0) return;

    if (frameAvgMs > 24.5 && resTier < RES_TIERS.length - 1) {
      resTier++;
      allocateRenderTargets(RES_TIERS[resTier]);
      scaleCooldown = 2.5;
    } else if (frameAvgMs < 15.2 && resTier > 0) {
      resTier--;
      allocateRenderTargets(RES_TIERS[resTier]);
      scaleCooldown = 4.0;
    }
  }

  function frame(ts) {
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    if (!lastTs) lastTs = ts;
    const rawMs = ts - lastTs;
    lastTs = ts;
    const dt = clamp(rawMs * 0.001, 0.001, 0.05);

    maybeAdaptResolution(dt, rawMs);
    stepSimulation(dt);
    renderWebGL();
    drawCockpitAndHud(dt);
    updateMissileHudDom();
  }

  window.addEventListener('resize', () => {
    allocateRenderTargets(RES_TIERS[resTier]);
  });

  // =========================================================================
  // 16. BOOT SEQUENCE (WEB WORKERS + PROGRESS BAR) & CLEAN LIFECYCLE API
  // =========================================================================
  const progressFill = document.getElementById('progressFill');
  const loadStatus = document.getElementById('loadStatus');
  const loaderEl = document.getElementById('loader');

  // Pick a scenic spawn point over a lake looking toward sunlit autumn peaks & sunset!
  function chooseScenicSpawn() {
    let bestX = 0, bestZ = 0, bestScore = -1e9;
    for (let gy = 0; gy < 16; gy++) {
      for (let gx = 0; gx < 16; gx++) {
        const wx = (gx / 16) * TILE_SIZE;
        const wz = (gy / 16) * TILE_SIZE;
        const hCenter = sampleTerrainMeters(wx, wz);
        const hAhead = sampleTerrainMeters(wx + SUN_DIR[0] * 480, wz + SUN_DIR[2] * 480);
        const hSide = sampleTerrainMeters(wx - SUN_DIR[2] * 260, wz + SUN_DIR[0] * 260);
        // Prefer starting over open lake water with mountains visible ahead & nearby wooded shores!
        let score = 0;
        if (hCenter < -4) score += 40;
        if (hAhead > 60) score += 35 + Math.min(hAhead, 180) * 0.3;
        if (hSide > 15 && hSide < 110) score += 25;
        if (score > bestScore) { bestScore = score; bestX = wx; bestZ = wz; }
      }
    }
    plane.pos = [bestX, CRUISE_ALT_Y, bestZ];
    // Face roughly West-Northwest so sunset glow & autumn mountains frame beautifully!
    plane.yaw = Math.atan2(SUN_DIR[0], -SUN_DIR[2]) + 0.28;
    cam.chaseYaw = plane.yaw;
    computePlaneBasis();
  }

  async function boot() {
    allocateRenderTargets(RES_TIERS[resTier]);
    try {
      terrainData = await generateTerrainWithWorkers((frac, text) => {
        progressFill.style.width = Math.round(frac * 100) + '%';
        loadStatus.textContent = text;
      });
      progressFill.style.width = '100%';
      loadStatus.textContent = 'READY FOR TAKEOFF';
      uploadTerrainTextures(terrainData);
      chooseScenicSpawn();

      // Pre-step 1 frame so camera matrices are valid immediately
      stepSimulation(0.016);
      renderWebGL();
      drawCockpitAndHud(0.016);

      running = true;
      rafId = requestAnimationFrame(frame);

      loaderEl.classList.add('hidden');
    } catch (err) {
      console.error('Patrol boot error:', err);
      loadStatus.textContent = 'ERROR: ' + err.message;
    }
  }

  // Expose clean inspection/control API for automated verification & potential future embedding
  window.__PATROL__ = {
    isReady: () => running && !!terrainData,
    getState: () => ({
      cameraMode: CAMERA_MODES[cam.mode],
      cameraIndex: cam.mode,
      camTrans: cam.trans,
      pos: [...plane.pos],
      yaw: plane.yaw,
      pitch: plane.pitch,
      bank: plane.bank,
      visualRoll: plane.visualRoll,
      speed: plane.speed,
      burner: plane.burner,
      radAlt: plane.radAlt,
      pullUp: plane.pullUp,
      gLoad: plane.gLoad,
      readyMissiles: pylons.filter((p) => p.reload <= 0).length,
      activeMissiles: activeMissiles.length,
      particles: particles.length,
      shockRings: shockRings.length,
      internalW, internalH, resTier,
      frameAvgMs,
      simTime,
      soundEnabled: sfx.enabled,
      glError: gl.getError()
    }),
    setCameraMode: (idx, instant = false) => {
      cam.prevMode = cam.mode;
      cam.mode = ((idx % 3) + 3) % 3;
      cam.trans = instant ? 1.0 : 0.0;
      viewBtn.textContent = CAMERA_MODES[cam.mode];
    },
    cycleCamera,
    fireMissile,
    triggerBarrelRoll,
    setMouse: (nx, ny) => { input.mouseX = clamp(nx, 0, 1); input.mouseY = clamp(ny, 0, 1); dismissTitle(); },
    setBurner: (on) => { input.touchBurn = !!on; dismissTitle(); },
    setPlanePose: (x, y, z, yaw, pitch) => {
      plane.pos = [x, y, z];
      if (yaw !== undefined) { plane.yaw = yaw; cam.chaseYaw = yaw; }
      if (pitch !== undefined) { plane.pitch = pitch; cam.chasePitch = pitch; }
      computePlaneBasis();
    },
    sampleTerrainMeters,
    stepFrames: (count, dt = 1 / 60) => {
      for (let i = 0; i < count; i++) stepSimulation(dt);
      renderWebGL();
      drawCockpitAndHud(dt);
      updateMissileHudDom();
    },
    destroy: () => {
      running = false;
      cancelAnimationFrame(rafId);
      sfx.setEnabled(false);
    }
  };

  boot();
})();
</script>
</body>
</html>
